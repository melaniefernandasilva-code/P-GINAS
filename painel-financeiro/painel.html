/* ---------- Gráficos (SVG) ---------- */
function lineChart(days, { height = 180, start } = {}) {
  if (!days || days.length < 2) return '<p class="muted">Sem dados suficientes para o gráfico.</p>';
  const W = 640, H = height, pl = 56, pr = 12, pt = 12, pb = 26;
  const ys = days.map((d) => d.bal);
  let min = Math.min(0, ...ys), max = Math.max(0, ...ys);
  if (max === min) max = min + 100;
  const pad = (max - min) * 0.08; min -= pad; max += pad;
  const x = (i) => pl + (i / (days.length - 1)) * (W - pl - pr);
  const y = (v) => pt + (1 - (v - min) / (max - min)) * (H - pt - pb);
  const pts = days.map((d, i) => `${x(i).toFixed(1)},${y(d.bal).toFixed(1)}`).join(' ');
  const area = `${pl},${y(Math.max(min, 0)).toFixed(1)} ${pts} ${x(days.length - 1).toFixed(1)},${y(Math.max(min, 0)).toFixed(1)}`;
  const ticks = [min + pad, (min + max) / 2, max - pad].map((v) => `<g><line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end" class="axis">${U.moneyShort(v)}</text></g>`).join('');
  const zero = min < 0 ? `<line x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}" class="zero"/>` : '';
  const step = Math.max(1, Math.round(days.length / 5));
  const xl = days.map((d, i) => (i % step === 0 || i === days.length - 1) ? `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === days.length - 1 ? 'end' : 'middle'}" class="axis">${U.fmtDay(d.date)}</text>` : '').join('');
  const minI = ys.indexOf(Math.min(...ys));
  const neg = days.findIndex((d) => d.bal < 0);
  const negMark = neg >= 0 ? `<circle cx="${x(neg)}" cy="${y(days[neg].bal)}" r="4.5" class="dot-neg"/>` : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Saldo projetado de ${U.fmtDate(days[0].date)} a ${U.fmtDate(days[days.length - 1].date)}. Menor saldo ${U.money(ys[minI])} em ${U.fmtDate(days[minI].date)}.">${ticks}${zero}<polygon points="${area}" class="area"/><polyline points="${pts}" class="line"/><circle cx="${x(minI)}" cy="${y(ys[minI])}" r="4" class="dot-min"/>${negMark}<circle cx="${x(days.length - 1)}" cy="${y(ys[ys.length - 1])}" r="4" class="dot-end"/>${xl}</svg>`;
}
function barsChart(rows, { height = 170 } = {}) {
  // rows: [{label, in, out}]
  if (!rows.length) return '<p class="muted">Sem dados no período.</p>';
  const W = 640, H = height, pl = 56, pr = 8, pt = 10, pb = 24;
  const max = Math.max(1, ...rows.map((r) => Math.max(r.in, r.out)));
  const bw = (W - pl - pr) / rows.length;
  const y = (v) => pt + (1 - v / max) * (H - pt - pb);
  const bars = rows.map((r, i) => {
    const x0 = pl + i * bw + bw * 0.15, w = bw * 0.33;
    return `<rect x="${x0}" y="${y(r.in)}" width="${w}" height="${H - pb - y(r.in)}" class="bar-in" rx="3"><title>${r.label}: entradas ${U.money(r.in)}</title></rect><rect x="${x0 + w + bw * 0.04}" y="${y(r.out)}" width="${w}" height="${H - pb - y(r.out)}" class="bar-out" rx="3"><title>${r.label}: saídas ${U.money(r.out)}</title></rect><text x="${pl + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle" class="axis">${r.label}</text>`;
  }).join('');
  const ticks = [0, max / 2, max].map((v) => `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end" class="axis">${U.moneyShort(v)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas e saídas por mês">${ticks}${bars}</svg><div class="legend"><span><i class="sw sw-in"></i>Entradas</span><span><i class="sw sw-out"></i>Saídas</span></div>`;
}
function hbars(list, total) {
  if (!list.length) return '<p class="muted">Nenhum gasto no período.</p>';
  const max = Math.max(...list.map((x) => Math.max(x.value, x.limit || 0)), 1);
  return `<ul class="hbars">${list.map((x) => {
    const over = x.limit && x.value > x.limit;
    return `<li><div class="hb-top"><span>${h(x.label)}</span><strong>${money(x.value)}${total ? ` <small class="muted">${U.pct(x.value / total)}</small>` : ''}</strong></div><div class="hb-track"><span class="${over ? 'over' : ''}" style="width:${(x.value / max * 100).toFixed(1)}%"></span>${x.limit ? `<i class="hb-limit" style="left:${(x.limit / max * 100).toFixed(1)}%" title="Limite ${money(x.limit)}"></i>` : ''}</div>${x.limit ? `<small class="${over ? 'txt-bad' : 'muted'}">${over ? icon('warn') + ' ' : ''}Limite ${money(x.limit)}${over ? `, ${money(x.value - x.limit)} acima` : `, restam ${money(x.limit - x.value)}`}</small>` : ''}</li>`;
  }).join('')}</ul>`;
}

/* ---------- Eventos globais ---------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el.dataset, el, e); }
});
document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-chg]');
  if (!el) return;
  const fn = CHG[el.dataset.chg];
  if (fn) fn(el.value, el, e);
});

/* Início, configuração guiada e visão conjunta. */

function setupProgress() {
  const steps = M.SETUP_STEPS.map((s) => ({ ...s, st: S.setup[s.key] }));
  const done = steps.filter((s) => s.st === 'feito').length;
  return { steps, done, total: steps.length };
}

VIEWS.inicio = () => {
  const T = E.today();
  const sp = setupProgress();
  const d = data();
  const hasAny = S.accounts.length || S.clients.length || S.entries.length || S.series.length;
  const greet = `<header class="page-h"><div><p class="eyebrow">${U.fmtDate(T)} · início da organização: ${S.settings.startDate ? U.fmtDate(S.settings.startDate) : 'não definido'}</p><h1>Olá, Mel</h1></div><button class="btn primary hide-m" data-act="quickAdd">${icon('plus')}Lançar</button></header>`;
  if (!hasAny) {
    return greet + `<section class="card hero-empty"><h2>Vamos começar do zero, com calma</h2><p>O painel ainda não tem dados. Nada aqui é preenchido por conta própria: tudo o que aparecer vai vir do que você cadastrar. A configuração é dividida em etapas curtas e você pode pular e voltar depois.</p><div class="actions"><button class="btn primary" data-act="go" data-route="config" data-tab="guia">Começar a configuração guiada</button><button class="btn ghost" data-act="demoOn">Ver uma demonstração</button></div><p class="muted small">A demonstração usa dados fictícios em um modo separado, identificado no topo da tela. Ela não mistura nada com os seus dados.</p></section>` + setupCard(sp);
  }
  const bal = E.balances(S, d);
  const reserved = U.sum(S.reserves.filter((r) => !r.archived), (r) => E.reserveBalance(S, r));
  const to30 = U.addDays(T, 30);
  const p30 = E.projection(S, { to: to30, data: d });
  const pH = E.projection(S, { to: U.addMonths(T, S.settings.horizon || 6), data: d });
  const cm = U.monthKey(T);
  const rp = E.results(S, d, 'profissional', [cm]);
  const rs = E.results(S, d, 'pessoal', [cm]);
  const com = E.commitment(S, d, [cm]);
  const al = safeAlerts().filter((a) => a.prio <= 2).slice(0, 5);
  const upcoming = d.items.filter((i) => (i.status === 'previsto' || i.status === 'vencido') && i.date <= U.addDays(T, 7) && i.cash.length).slice(0, 8);
  return greet + `
  ${sp.done < sp.total ? setupCard(sp, true) : ''}
  ${partialBanner(pH.partial)}
  <section class="kpis">
    ${kpi('Dinheiro em contas hoje', money(bal.total), `livre para uso; reservado à parte: ${money(reserved)}`)}
    ${kpi('Próximos 30 dias', `<span class="amt-in">+${U.moneyShort(p30.totalIn)}</span> <span class="amt-out">−${U.moneyShort(p30.totalOut)}</span>`, `saldo previsto em ${U.fmtDate(to30)}: ${money(p30.end)}`)}
    ${kpi('Menor saldo previsto', money(pH.minBal), `${U.fmtDate(pH.minDate)}, em ${S.settings.horizon || 6} meses`, pH.minBal < 0 ? 'bad' : '')}
    ${kpi('Primeiro dia de falta', pH.firstNeg ? U.fmtDate(pH.firstNeg) : 'nenhum previsto', pH.firstNeg ? 'no total das contas' : `até ${U.fmtDate(pH.to)}, com o que está cadastrado`, pH.firstNeg ? 'bad' : 'good')}
  </section>
  ${al.length ? `<section class="card"><div class="card-h"><h2>${icon('alert')}Atenção agora</h2><button class="link" data-act="go" data-route="diagnostico">Ver todos</button></div><ul class="alerts">${al.map(alertItem).join('')}</ul></section>` : ''}
  <section class="two">
    <div class="card"><div class="card-h"><h2>${icon('briefcase')}Profissional em ${U.fmtMonth(cm)}</h2><button class="link" data-act="go" data-route="profissional">Abrir</button></div>
      <dl class="dl compact">
        <dt>Faturamento recebido</dt><dd class="amt-in">${money(rp.receita.pago)}</dd>
        <dt>A receber no mês</dt><dd>${money(rp.receita.previsto + rp.receita.vencido)}${rp.receita.vencido ? ` <span class="txt-bad">(${money(rp.receita.vencido)} em atraso)</span>` : ''}</dd>
        <dt>Despesas operacionais</dt><dd class="amt-out">${money(rp.despesa.total)}</dd>
        <dt>Resultado operacional previsto</dt><dd><strong class="${rp.resultado < 0 ? 'txt-bad' : ''}">${money(rp.resultado)}</strong></dd>
        <dt>Retiradas pessoais</dt><dd>${money(rp.retirada.total)}</dd>
        <dt>Caixa profissional hoje</dt><dd>${money(bal.byNature.profissional)}</dd>
      </dl></div>
    <div class="card"><div class="card-h"><h2>${icon('user')}Pessoal em ${U.fmtMonth(cm)}</h2><button class="link" data-act="go" data-route="pessoal">Abrir</button></div>
      <dl class="dl compact">
        <dt>Entradas (renda + retiradas)</dt><dd class="amt-in">${money(com.renda)}</dd>
        <dt>Saídas previstas e pagas</dt><dd class="amt-out">${money(com.total)}</dd>
        <dt>Comprometido</dt><dd>${com.renda > 0 ? `<strong class="${com.pct.total > 1 ? 'txt-bad' : ''}">${U.pct(com.pct.total)}</strong> das entradas do mês` : '<span class="muted">sem entradas cadastradas no mês</span>'}</dd>
        <dt>Cartões no mês</dt><dd>${money(com.cartoes)}</dd>
        <dt>Dívidas no mês</dt><dd>${money(com.dividas)}</dd>
        <dt>Dinheiro pessoal hoje</dt><dd>${money(bal.byNature.pessoal)}</dd>
      </dl></div>
  </section>
  <section class="card"><div class="card-h"><h2>${icon('calendar')}Próximos 7 dias e atrasos</h2><button class="link" data-act="go" data-route="calendario">Calendário</button></div>
    <div class="list">${upcoming.length ? upcoming.map((i) => itemRow(i, { nature: true })).join('') : emptyState('Nada previsto para os próximos 7 dias.')}</div></section>
  ${jointView(d, bal)}`;
};

function setupCard(sp, compact) {
  const next = sp.steps.find((s) => !s.st);
  return `<section class="card setup"><div class="card-h"><h2>${icon('task')}Configuração guiada</h2><span class="muted">${sp.done} de ${sp.total} etapas concluídas</span></div>${progressBar(sp.done / sp.total, 'Progresso da configuração')}
  <ol class="steps">${sp.steps.map((s) => `<li class="step st-${s.st || 'pendente'}"><span class="step-dot">${s.st === 'feito' ? icon('check') : s.st === 'pulado' ? icon('right') : ''}</span><span><strong>${s.title}</strong>${!compact ? `<small>${s.desc}</small>` : ''}${s.st !== 'feito' && !compact ? `<small class="muted">Enquanto isso: ${s.limit}</small>` : ''}</span><span class="step-st">${s.st === 'feito' ? 'Concluída' : s.st === 'pulado' ? 'Pulada' : 'Pendente'}</span></li>`).join('')}</ol>
  ${next ? `<div class="actions"><button class="btn primary" data-act="go" data-route="config" data-tab="guia">Continuar: ${next.title}</button></div>` : ''}</section>`;
}

function alertItem(a) {
  const ic = a.prio === 1 ? 'alert' : a.prio === 2 ? 'warn' : 'info';
  return `<li class="alert p${a.prio}"><span class="a-ic">${icon(ic)}</span><div class="a-body"><span class="a-t">${h(a.title)}</span><span class="a-s">${a.prio === 1 ? 'Prioridade alta' : a.prio === 2 ? 'Prioridade média' : 'Para acompanhar'} · ${natChip(a.nature)} ${a.value != null ? '· ' + money(Math.abs(a.value)) : ''}</span></div>${a.link ? `<button class="icon-btn" ${linkAttrs(a.link)} aria-label="Abrir">${icon('right')}</button>` : ''}</li>`;
}

// Visão conjunta: como o dinheiro circula entre pessoal e profissional
function jointView(d, bal) {
  const T = E.today();
  const cm = U.monthKey(T);
  const rp = E.results(S, d, 'profissional', [cm]);
  const rs = E.results(S, d, 'pessoal', [cm]);
  const open = UI.expanded.joint;
  return `<section class="card"><div class="card-h"><h2>${icon('swap')}Visão conjunta da circulação</h2><button class="link" data-act="toggle" data-k="joint">${open ? 'Esconder' : 'Mostrar'}</button></div>
  ${open ? `<p class="muted small">Mostra por onde o dinheiro passou em ${U.fmtMonthFull(cm)}, sempre com a origem. Não substitui as visões separadas.</p>
  <div class="flow">
    <div class="flow-box"><span class="eyebrow">Profissional</span><strong>${money(bal.byNature.profissional)}</strong><small>caixa atribuído hoje</small></div>
    <div class="flow-arrows"><span>Retiradas ${money(rp.retirada.total)} ${icon('right')}</span><small>${rp.implicitRetirada ? `inclui ${money(rp.implicitRetirada)} de contas pessoais pagas pela PJ ou receitas que caíram em conta pessoal` : 'só transferências registradas'}</small><span>${icon('left')} Aportes ${money(rs.aporte_pro.total)}</span><small>dinheiro pessoal usado no profissional</small></div>
    <div class="flow-box"><span class="eyebrow">Pessoal</span><strong>${money(bal.byNature.pessoal)}</strong><small>dinheiro atribuído hoje</small></div>
  </div>
  <h3 class="sec">Saldo por conta</h3>
  <div class="list">${S.accounts.filter((a) => !a.archived).map((a) => `<div class="row static"><div class="row-main"><span class="row-t">${h(a.name)}</span><span class="row-s">${a.type === 'pj' ? 'PJ' : 'Pessoal'}${a.allocOther ? ` · ${money(a.allocOther)} atribuídos ao ${a.type === 'pj' ? 'pessoal' : 'profissional'}` : ''}${bal.byId[a.id].known ? '' : ' · saldo não informado'}</span></div><strong class="row-amt">${money(bal.byId[a.id].balance)}</strong></div>`).join('')}</div>
  <p class="muted small">Atribuição por natureza: o saldo de cada conta pertence à natureza do tipo da conta, a não ser que você indique uma parte para a outra natureza (em Contas). Como o dinheiro circula entre as três contas, essa divisão é uma aproximação.</p>` : ''}</section>`;
}

/* ---------- Configuração guiada ---------- */
function guideView() {
  const sp = setupProgress();
  const cur = UI.guideStep || (sp.steps.find((s) => !s.st) || sp.steps[0]).key;
  const step = sp.steps.find((s) => s.key === cur);
  const body = GUIDE[cur] ? GUIDE[cur]() : '';
  return `<p class="muted">Cada etapa é curta. O progresso fica salvo e dá para pular e voltar quando quiser. Nada é preenchido por você: o painel mostra só o que for cadastrado.</p>
  ${progressBar(sp.done / sp.total, 'Progresso')}
  <div class="guide">
    <ol class="guide-nav">${sp.steps.map((s, i) => `<li><button class="${s.key === cur ? 'on' : ''} st-${s.st || 'pendente'}" data-act="guideStep" data-k="${s.key}"><span class="step-dot">${s.st === 'feito' ? icon('check') : i + 1}</span><span>${s.title}</span></button></li>`).join('')}</ol>
    <div class="card guide-body"><h2>${step.title}</h2><p>${step.desc}</p>${step.st !== 'feito' ? `<p class="banner soft">${icon('info')}<span>${step.limit}</span></p>` : ''}${body}
      <div class="actions wrap">${step.st === 'feito' ? `<button class="btn ghost" data-act="guideSet" data-k="${cur}" data-v="">Reabrir etapa</button>` : `<button class="btn ghost" data-act="guideSet" data-k="${cur}" data-v="pulado">Pular por enquanto</button><button class="btn primary" data-act="guideSet" data-k="${cur}" data-v="feito">Concluir etapa</button>`}</div></div>
  </div>`;
}
ACT.guideStep = (d) => { UI.guideStep = d.k; render(); };
ACT.guideSet = (d) => {
  if (d.k === 'start' && d.v === 'feito' && !S.settings.startDate) { toast('Escolha a data de início antes de concluir.', 'erro'); return; }
  commit((st) => { st.setup[d.k] = d.v || null; }, d.v === 'feito' ? 'Etapa concluída.' : d.v === 'pulado' ? 'Etapa pulada. Você pode voltar depois.' : 'Etapa reaberta.');
  if (d.v) { const next = M.SETUP_STEPS.find((s) => !S.setup[s.key]); UI.guideStep = next ? next.key : d.k; render(); }
};

const GUIDE = {
  start: () => `<form class="inline-form" data-form="start"><label>Data de início <input type="date" id="g_start" value="${h(S.settings.startDate || E.today())}"></label><button class="btn primary" type="button" data-act="saveStart">Salvar data</button></form>
    <p class="muted small">Recorrências e mensalidades passam a ser geradas a partir dessa data. Nada anterior é criado. Saldos das contas são informados na próxima etapa, com a data de referência de cada um.</p>`,
  accounts: () => `${listMini(S.accounts.filter((a) => !a.archived).map((a) => [a.name, `${a.type === 'pj' ? 'PJ' : 'Pessoal'} · saldo ${a.initialBalance == null ? 'não informado' : money(a.initialBalance)} em ${U.fmtDate(a.refDate)}`]), 'Nenhuma conta cadastrada.')}
    <div class="actions wrap"><button class="btn primary" data-act="newAccount" data-type="pessoal">${icon('plus')}Conta pessoal</button><button class="btn primary" data-act="newAccount" data-type="pj">${icon('plus')}Conta PJ</button></div>
    <p class="muted small">Saldo vazio fica como "não informado", diferente de zero. Você pode informar depois.</p>`,
  clients: () => `${listMini(S.clients.filter((c) => !c.archived).map((c) => [c.name, `${money(c.amount)} por mês, vence dia ${c.dueDay}${c.endDate ? `, até ${U.fmtDate(c.endDate)}` : ', sem término'}`]), 'Nenhum cliente cadastrado.')}
    <div class="actions wrap"><button class="btn primary" data-act="newClient">${icon('plus')}Cliente</button><button class="btn ghost" data-act="newService">${icon('plus')}Serviço ou produto</button><button class="btn ghost" data-act="newEntry" data-type="receita" data-nature="profissional">${icon('plus')}Entrada pontual já combinada</button></div>`,
  fixed: () => `${listMini(S.series.filter((s) => !s.archived && s.type === 'despesa').map((s) => [s.description, `${money(s.amount)} ${(E.FREQ_LABEL[s.frequency] || '').toLowerCase()} · ${NAT[s.nature]}`]), 'Nenhum custo fixo cadastrado.')}
    <div class="actions wrap"><button class="btn primary" data-act="newEntry" data-type="despesa" data-nature="pessoal" data-recurrence="recorrente">${icon('plus')}Custo fixo pessoal</button><button class="btn primary" data-act="newEntry" data-type="despesa" data-nature="profissional" data-recurrence="recorrente">${icon('plus')}Custo fixo profissional</button><button class="btn ghost" data-act="newEntry" data-type="despesa">${icon('plus')}Conta única conhecida</button></div>
    <p class="muted small">Para contas que variam, como luz, marque "Estimativa". Assinaturas no cartão: escolha "Cartão de crédito" e "Assinatura mensal".</p>`,
  cards: () => `${listMini(S.cards.filter((c) => !c.archived).map((c) => [c.name, `${c.owner === 'mae' ? 'Cartão da mãe · ' : ''}fecha dia ${c.closingDay}, vence dia ${c.dueDay}`]), 'Nenhum cartão cadastrado.')}
    <div class="actions wrap"><button class="btn primary" data-act="newCard">${icon('plus')}Cartão</button><button class="btn ghost" data-act="newPurchase" data-old="1">${icon('plus')}Parcelas que ainda faltam</button></div>
    <p class="muted small">Para compras antigas, informe só o valor da parcela, quantas faltam e a próxima fatura. Não precisa cadastrar o que já foi pago.</p>`,
  debts: () => `${listMini(S.debts.filter((d) => d.status === 'ativa').map((d) => [d.creditor, `${d.balance == null ? 'saldo não informado' : money(d.balance)}${d.installmentsLeft ? ` · ${d.installmentsLeft} parcelas restantes` : ''}`]), 'Nenhuma dívida cadastrada.')}
    <div class="actions wrap"><button class="btn primary" data-act="newDebt">${icon('plus')}Dívida</button></div>
    <p class="muted small">Se só souber o saldo atual, tudo bem. Juros desconhecidos ficam em branco e o painel avisa que a estimativa é limitada. Parcelas que já estão em um cartão podem ser vinculadas à dívida, sem duplicar.</p>`,
  goals: () => `<ul class="checklist"><li><button class="link" data-act="go" data-route="config" data-tab="categorias">Revisar categorias e limites</button></li><li><button class="link" data-act="go" data-route="profissional" data-tab="meta">Definir meta mensal de faturamento</button></li><li><button class="link" data-act="newReserve" data-nature="pessoal" data-kind="reserva">Criar reserva de emergência pessoal</button></li><li><button class="link" data-act="newReserve" data-nature="profissional" data-kind="reserva">Criar reserva profissional</button></li><li><button class="link" data-act="newReserve" data-nature="pessoal" data-kind="objetivo">Criar um objetivo</button></li></ul>`,
};
function listMini(rows, empty) { return rows.length ? `<ul class="mini">${rows.map(([t, s]) => `<li><strong>${h(t)}</strong><small>${s}</small></li>`).join('')}</ul>` : `<p class="muted">${empty}</p>`; }
ACT.saveStart = () => {
  const v = $('#g_start').value;
  if (!U.validISO(v)) { toast('Escolha uma data válida.', 'erro'); return; }
  commit((st) => { st.settings.startDate = v; if (!st.settings.cardGoalStart) st.settings.cardGoalStart = v; }, 'Data de início salva.');
};

/* Lançamentos: lista, detalhe de ocorrência, formulários de receita/despesa e recorrência. */

function horizonTo() { return U.addMonths(E.today(), Math.max(24, S.settings.horizon || 6)); }
function data() { return E.build(S, horizonTo()); }
function findItemByKey(key) { return data().items.find((i) => i.key === key) || null; }

function itemRow(it, opts = {}) {
  const inflow = it.cash ? it.cash.reduce((a, c) => a + c.delta, 0) : 0;
  const isTransfer = it.type === 'transferencia';
  const amtCls = isTransfer ? 'amt-neutral' : inflow > 0 ? 'amt-in' : inflow < 0 ? 'amt-out' : 'amt-neutral';
  const amt = isTransfer ? money(it.amount) : inflow !== 0 ? signed(inflow) : money(it.amount);
  const sub = [];
  if (opts.showDate !== false) sub.push(U.fmtDate(it.date));
  if (it.label) sub.push(h(it.label));
  if (it.type === 'transferencia') sub.push(`${h(accName(it.ref.fromId))} para ${h(accName(it.ref.toId))}`);
  else if (it.accountId !== undefined && it.src !== 'card') sub.push(h(it.accountId ? accName(it.accountId) : 'sem conta'));
  if (it.categoryId) sub.push(h(catName(it.categoryId)));
  if (it.ref?.paidByPurchaseId) sub.push('pago com Pix no crédito');
  return `<button class="row" data-act="item" data-key="${h(it.key)}" id="rec-${h(it.id || '')}"><div class="row-main"><span class="row-t">${h(it.desc || 'Sem descrição')}</span><span class="row-s">${sub.join(' · ')}</span><span class="row-tags">${statusPill(it)}${certPill(it.certainty)}${opts.nature ? natChip(it.nature) : ''}${it.src === 'series' || it.src === 'client' ? '<span class="pill soft">recorrente</span>' : ''}</span></div><strong class="row-amt ${amtCls}">${amt}</strong></button>`;
}
function cardRowHTML(r) {
  return `<button class="row" data-act="purchase" data-id="${h(r.p ? r.p.id : '')}" ${r.p && !r.p.virtual ? '' : 'disabled'}><div class="row-main"><span class="row-t">${h(r.desc)}</span><span class="row-s">Cartão ${h(cardName(r.cardId))} · fatura ${U.fmtMonth(r.month)}${r.label ? ' · ' + h(r.label) : ''} · ${h(r.kind === 'divida' ? 'pagamento de crédito' : catName(r.categoryId))}</span><span class="row-tags">${statusPill(r)}<span class="pill soft">${icon('card')}cartão</span></span></div><strong class="row-amt amt-out">${signed(-r.amount)}</strong></button>`;
}

/* ---------- Detalhe de uma ocorrência ---------- */
ACT.item = (d) => openItem(d.key);
function openItem(key) {
  const it = findItemByKey(key);
  if (!it) { toast('Registro não encontrado. Ele pode ter sido alterado.', 'erro'); return; }
  const srcText = {
    entry: 'Lançamento registrado.',
    series: 'Ocorrência gerada por uma recorrência. Ao confirmar ou editar, ela vira um lançamento registrado.',
    client: 'Mensalidade gerada pelo contrato do cliente, dentro da vigência.',
    debt: 'Pagamento previsto pela dívida cadastrada.',
    invoice: 'Valor restante da fatura do cartão. As compras já contam como despesa por categoria; o pagamento só movimenta o caixa.',
    plan: 'Aporte planejado na reserva ou objetivo. Não é despesa.',
    pix: 'Valor de Pix no crédito que entrou na conta. É crédito, não renda.',
  }[it.src] || '';
  const e = it.src === 'entry' ? it.ref : null;
  const rows = [
    ['Valor', money(Math.abs(it.amount))],
    ['Situação', statusPill(it) + ' ' + certPill(it.certainty)],
    [it.status === 'pago' ? 'Data efetiva' : 'Data prevista', U.fmtDate(it.status === 'pago' ? (it.paidDate || it.date) : it.dueDate || it.date)],
    it.status === 'pago' && it.dueDate && it.dueDate !== it.paidDate ? ['Data prevista', U.fmtDate(it.dueDate)] : null,
    it.nature ? ['Natureza', natChip(it.nature)] : null,
    it.type === 'transferencia' ? ['Contas', `${h(accName(e.fromId))} para ${h(accName(e.toId))}`] : it.accountId !== undefined ? ['Conta', h(it.accountId ? accName(it.accountId) : 'Sem conta definida')] : null,
    it.categoryId ? ['Categoria', h(catName(it.categoryId))] : null,
    e && e.method ? ['Forma de pagamento', h((METHODS.find((m) => m[0] === e.method) || [0, e.method])[1])] : null,
    it.label ? ['Parcela', h(it.label)] : null,
    e && e.notes ? ['Observações', h(e.notes)] : null,
  ].filter(Boolean);
  const implicit = (it.pnl || []).filter((p) => p.implicit && (p.kind === 'retirada' || p.kind === 'aporte_pro'));
  const btn = [];
  const canConfirm = it.status !== 'pago' && it.status !== 'cancelado' && ['entry', 'series', 'client', 'debt', 'invoice', 'plan'].includes(it.src) && it.type !== 'ajuste';
  if (canConfirm) btn.push(`<button class="btn primary" data-act="confirmItem" data-key="${h(key)}">${icon('check')}${it.cash?.some((c) => c.delta > 0) && it.type !== 'transferencia' ? 'Confirmar recebimento' : 'Confirmar pagamento'}</button>`);
  if (it.src === 'entry' && it.status === 'pago' && ['receita', 'despesa', 'transferencia'].includes(it.type)) btn.push(`<button class="btn ghost" data-act="unconfirm" data-id="${e.id}">Voltar para previsto</button>`);
  if (['entry', 'series', 'client', 'debt'].includes(it.src) && ['receita', 'despesa', 'transferencia'].includes(it.type)) btn.push(`<button class="btn ghost" data-act="editItem" data-key="${h(key)}">${icon('edit')}Editar</button>`);
  if (it.status !== 'cancelado' && ['series', 'client', 'debt'].includes(it.src) || (it.src === 'entry' && it.status === 'previsto')) btn.push(`<button class="btn ghost" data-act="cancelItem" data-key="${h(key)}">${icon('x')}Cancelar esta ocorrência</button>`);
  if (it.src === 'entry' && it.status === 'cancelado') btn.push(`<button class="btn ghost" data-act="uncancel" data-id="${e.id}">Reativar</button>`);
  if (it.src === 'entry') btn.push(`<button class="btn ghost danger-txt" data-act="deleteEntry" data-id="${e.id}">${icon('trash')}Excluir</button>`);
  if (it.src === 'series') btn.push(`<button class="btn ghost" data-act="editSeries" data-id="${it.id}">Abrir recorrência</button>`);
  if (it.src === 'client') btn.push(`<button class="btn ghost" data-act="go" data-route="profissional" data-tab="clientes" data-id="${it.id}">Abrir cliente</button>`);
  if (it.src === 'debt') btn.push(`<button class="btn ghost" data-act="go" data-route="dividas" data-id="${it.id}">Abrir dívida</button>`);
  if (it.src === 'invoice') btn.push(`<button class="btn ghost" data-act="invoice" data-key="${h(it.invKey)}">Ver fatura</button>`);
  if (e && e.seriesRef) btn.push(`<button class="btn ghost" data-act="editSeries" data-id="${e.seriesRef.id}">Abrir recorrência</button>`);
  openModal(`<p class="muted">${srcText}</p><dl class="dl">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>${implicit.length ? `<div class="banner soft">${icon('swap')}<div>${implicit[0].kind === 'retirada' ? `Dinheiro da conta PJ usado para algo pessoal: conta como <strong>retirada</strong> de ${money(implicit[0].amount)} no profissional e como recurso recebido no pessoal.` : `Dinheiro pessoal usado para algo profissional: aparece como <strong>aporte do pessoal</strong> de ${money(implicit[0].amount)}.`} Para corrigir, edite a conta ou a natureza.</div></div>` : ''}<div class="actions wrap">${btn.join('')}</div>`, { title: it.desc || 'Registro' });
}

ACT.confirmItem = (d) => {
  const it = findItemByKey(d.key);
  if (!it) return;
  closeModal();
  const isIn = it.cash.some((c) => c.delta > 0) && it.type !== 'transferencia';
  const showAcc = it.type !== 'transferencia';
  openForm({
    title: isIn ? 'Confirmar recebimento' : 'Confirmar pagamento',
    intro: `<p><strong>${h(it.desc)}</strong>, previsto para ${U.fmtDate(it.dueDate || it.date)}.</p>`,
    fields: [
      { k: 'amount', label: isIn ? 'Valor recebido' : 'Valor pago', type: 'money', req: true, min: 1, half: true },
      { k: 'paidDate', label: 'Data efetiva', type: 'date', req: true, half: true },
      ...(showAcc ? [{ k: 'accountId', label: isIn ? 'Entrou na conta' : 'Saiu da conta', type: 'select', options: accOptions() }] : []),
      { k: 'note', type: 'info', info: (v) => it.src === 'invoice' && v.amount && v.amount < it.amount ? `<p class="muted">Pagamento parcial: ficam ${money(it.amount - v.amount)} em aberto nesta fatura.</p>` : '' },
    ],
    values: { amount: it.amount, paidDate: E.today(), accountId: it.accountId || '' },
    submitLabel: 'Confirmar',

      const it2 = A.findItem(st, it.key, horizonTo());

      A.confirm(st, it2, { paidDate: v.paidDate, amount: v.amount, accountId: showAcc ? (v.accountId || null) : undefined });
    }, isIn ? 'Recebimento confirmado.' : 'Pagamento confirmado.'),

ACT.unconfirm = (d) => commit((st) => A.unconfirm(st, d.id), 'Voltou para previsto.');
ACT.uncancel = (d) => commit((st) => { const e = st.entries.find((x) => x.id === d.id); e.status = 'previsto'; }, 'Ocorrência reativada.');
ACT.cancelItem = (d) => {

};
ACT.deleteEntry = (d) => {
  const e = S.entries.find((x) => x.id === d.id);
  const extra = e.seriesRef || e.clientRef || e.debtRef ? '<p class="muted">Este lançamento veio de uma recorrência, cliente ou dívida. Ao excluir, a ocorrência prevista original volta a aparecer. Para que ela não conte, use "Cancelar esta ocorrência".</p>' : '';

};

/* ---------- Formulário de receita/despesa ---------- */
function entryFields(mode) {
  // mode: 'new' | 'edit-entry' | 'edit-occ'
  const isNew = mode === 'new';
  return [
    { k: 'type', label: 'Tipo', type: 'chips', options: [['despesa', 'Despesa'], ['receita', 'Receita']], when: () => isNew },
    { k: 'description', label: 'Descrição', type: 'text', req: true, placeholder: 'Ex.: Canva, aluguel, mensalidade' },
    { k: 'amount', label: 'Valor', type: 'money', req: true, min: 1, half: true },
    { k: 'nature', label: 'Natureza', type: 'chips', options: [['pessoal', 'Pessoal'], ['profissional', 'Profissional']], half: true, help: 'Depende do uso, não da conta ou cartão.' },
    { k: 'categoryId', label: 'Categoria', type: 'select', dynamic: true, options: (v) => catOptions(v.nature, v.type) },
    { k: 'payWith', label: 'Pagamento por', type: 'chips', options: [['conta', 'Conta'], ['cartao', 'Cartão de crédito']], when: (v) => isNew && v.type === 'despesa' },
    { k: 'accountId', label: 'Conta', type: 'select', options: accOptions(), when: (v) => v.type === 'receita' || v.payWith !== 'cartao' || !isNew, half: true },
    { k: 'cardId', label: 'Cartão', type: 'select', options: () => cardOptions().length ? cardOptions() : [['', 'Nenhum cartão cadastrado']], when: (v) => isNew && v.type === 'despesa' && v.payWith === 'cartao', half: true },
    { k: 'method', label: 'Forma', type: 'select', options: [['', 'Não informar'], ...METHODS], when: (v) => v.payWith !== 'cartao' || !isNew, half: true },
    { k: 'dueDate', label: (isNew ? 'Data prevista' : 'Data prevista'), type: 'date', req: true, half: true },
    { k: 'status', label: 'Situação', type: 'chips', options: (v) => [['previsto', 'Previsto'], ['pago', v.type === 'receita' ? 'Já recebido' : 'Já pago']], when: (v) => !(isNew && v.payWith === 'cartao' && v.type === 'despesa'), half: true },
    { k: 'paidDate', label: 'Data efetiva', type: 'date', when: (v) => v.status === 'pago' && !(isNew && v.payWith === 'cartao' && v.type === 'despesa'), half: true },
    { k: 'recurrence', label: 'Repetição', type: 'chips', options: (v) => v.payWith === 'cartao' && v.type === 'despesa' ? [['unica', 'Única ou parcelada'], ['recorrente', 'Assinatura mensal']] : [['unica', 'Única'], ['recorrente', 'Recorrente'], ['parcelada', 'Parcelada (boleto/carnê)']], when: () => isNew },
    { k: 'n', label: 'Parcelas no cartão', type: 'number', min: 1, max: 48, step: 1, half: true, when: (v) => isNew && v.payWith === 'cartao' && v.type === 'despesa' && v.recurrence !== 'recorrente', help: 'O valor acima é o total da compra.' },
    { k: 'frequency', label: 'Frequência', type: 'select', options: FREQS, half: true, when: (v) => isNew && v.recurrence === 'recorrente' && v.payWith !== 'cartao' },
    { k: 'endDate', label: 'Termina em (opcional)', type: 'date', half: true, when: (v) => isNew && v.recurrence === 'recorrente' },
    { k: 'count', label: 'Número de parcelas', type: 'number', min: 2, max: 360, step: 1, half: true, when: (v) => isNew && v.recurrence === 'parcelada', help: 'O valor acima é o de cada parcela.' },
    { k: 'certainty', label: 'Certeza do valor', type: 'chips', options: [['confirmado', 'Valor conhecido'], ['estimado', 'Estimativa']], help: 'Contas variáveis, como luz, podem ficar como estimativa.' },
    { k: 'notes', label: 'Observações', type: 'textarea' },
    { k: 'prev', type: 'info', info: (v) => {
      if (!isNew) return '';
      if (v.payWith === 'cartao' && v.type === 'despesa' && v.cardId && v.dueDate && v.recurrence !== 'recorrente') {
        const card = S.cards.find((c) => c.id === v.cardId); if (!card) return '';
        const m = E.invoiceMonthFor(card, v.dueDate); const n = v.n || 1;
        const parts = v.amount > 0 ? U.split(v.amount, n) : [];
        return `<div class="banner soft">${icon('card')}<div>Primeira parcela na fatura de <strong>${U.fmtMonth(m)}</strong> (vence ${U.fmtDate(E.invoiceDueDate(S, card, m))})${n > 1 && parts.length ? `, ${n}x de ${money(parts[1] ?? parts[0])}${parts[0] !== parts[1] ? ` (primeira ${money(parts[0])})` : ''}, última em ${U.fmtMonth(U.addMonthKey(m, n - 1))}` : ''}. Dá para ajustar o mês da fatura depois, na compra.</div></div>`;
      }
      return '';
    } },
  ];
}
function openEntryForm(preset = {}) {
  const T = E.today();
  const nature = preset.nature || (UI.route === 'profissional' ? 'profissional' : 'pessoal');
  const values = { type: 'despesa', nature, payWith: 'conta', status: 'previsto', dueDate: T, paidDate: T, recurrence: 'unica', frequency: 'mensal', n: 1, certainty: 'confirmado', accountId: nature === 'profissional' ? (S.settings.defaultProAccountId || '') : (S.settings.defaultPesAccountId || ''), ...preset };
  openForm({
    title: values.type === 'receita' ? 'Nova receita' : 'Nova despesa',
    fields: entryFields('new'),
    values,
    submitLabel: 'Salvar',
    validate: (v) => (v.payWith === 'cartao' && v.type === 'despesa' && !v.cardId ? { cardId: 'Cadastre um cartão primeiro, em Cartões.' } : v.endDate && v.endDate < v.dueDate ? { endDate: 'O término precisa ser depois da primeira data.' } : null),
    onSubmit: (v) => commit((st) => createEntryFromForm(st, v), 'Lançamento salvo.'),
  });
}
function createEntryFromForm(st, v) {
  const now = Date.now();
  if (v.type === 'despesa' && v.payWith === 'cartao') {
    const card = st.cards.find((c) => c.id === v.cardId);
    if (v.recurrence === 'recorrente') {
      st.series.push({ id: U.uid('s_'), type: 'despesa', description: v.description, amount: v.amount, categoryId: v.categoryId, nature: v.nature, accountId: null, cardId: v.cardId, method: 'cartao', frequency: 'mensal', startDate: v.dueDate, endDate: v.endDate, count: null, certainty: v.certainty, notes: v.notes || '', createdAt: now });
      return;
    }
    st.purchases.push({ id: U.uid('p_'), kind: 'compra', cardId: v.cardId, description: v.description, date: v.dueDate, categoryId: v.categoryId, nature: v.nature, mode: 'total', total: v.amount, n: v.n || 1, firstInvoice: E.invoiceMonthFor(card, v.dueDate), status: 'ativa', notes: v.notes || '', createdAt: now });
    return;
  }
  if (v.recurrence === 'recorrente' || v.recurrence === 'parcelada') {
    const s = { id: U.uid('s_'), type: v.type, description: v.description, amount: v.amount, categoryId: v.categoryId, nature: v.nature, accountId: v.accountId, method: v.method || '', frequency: v.recurrence === 'parcelada' ? 'mensal' : v.frequency, startDate: v.dueDate, endDate: v.recurrence === 'recorrente' ? v.endDate : null, count: v.recurrence === 'parcelada' ? v.count : null, certainty: v.certainty, notes: v.notes || '', createdAt: now };
    st.series.push(s);
    if (v.status === 'pago') {
      const it = A.findItem(st, `s:${s.id}#0`, U.addMonths(E.today(), 24));
      if (it) A.confirm(st, it, { paidDate: v.paidDate || v.dueDate });
    }
    return;
  }
  st.entries.push({ id: U.uid('e_'), type: v.type, description: v.description, amount: v.amount, categoryId: v.categoryId, nature: v.nature, accountId: v.accountId, method: v.method || '', dueDate: v.dueDate, paidDate: v.status === 'pago' ? (v.paidDate || v.dueDate) : null, status: v.status, certainty: v.certainty, notes: v.notes || '', createdAt: now, paidAt: v.status === 'pago' ? now : null });
}

ACT.editItem = (d) => {
  const it = findItemByKey(d.key);
  if (!it) return;
  closeModal();
  if (it.type === 'transferencia') return openTransferForm(it.ref);
  const base = it.src === 'entry' ? it.ref : { description: it.desc, amount: it.amount, nature: it.nature, categoryId: it.categoryId, accountId: it.accountId, method: it.ref?.method || '', dueDate: it.date, certainty: it.certainty === 'contratado' ? 'confirmado' : it.certainty, notes: '' };
  const recurring = it.src === 'series' || it.src === 'client' || (it.src === 'entry' && it.ref.seriesRef);
  const fields = entryFields('edit').filter((f) => !['status', 'paidDate'].includes(f.k));
  if (it.src === 'entry' && it.status === 'pago') fields.splice(fields.findIndex((f) => f.k === 'dueDate') + 1, 0, { k: 'paidDate', label: 'Data efetiva', type: 'date', half: true });
  if (recurring && it.src !== 'entry') fields.unshift({ k: 'scope', label: 'Aplicar a', type: 'chips', options: it.src === 'client' ? [['one', 'Só esta mensalidade'], ['future', 'Esta e as próximas (reajuste)']] : [['one', 'Só esta ocorrência'], ['future', 'Esta e as próximas']], help: 'Ocorrências já pagas não são alteradas.' });
  openForm({
    title: 'Editar ' + (it.type === 'receita' ? 'receita' : 'despesa'),
    fields,
    values: { ...base, type: it.type, scope: 'one', payWith: 'conta', paidDate: base.paidDate },
    onSubmit: (v) => commit((st) => {
      const it2 = A.findItem(st, it.key, horizonTo());
      const ch = { description: v.description, amount: v.amount, nature: v.nature, categoryId: v.categoryId, accountId: v.accountId, method: v.method, dueDate: v.dueDate, certainty: v.certainty, notes: v.notes };
      if (it.src === 'entry' && it.status === 'pago' && v.paidDate) ch.paidDate = v.paidDate;
      if (it.src === 'client' && v.scope === 'future') { A.editOccurrence(st, it2, { amount: v.amount }, 'future'); return; }
      const r = A.editOccurrence(st, it2, ch, v.scope || 'one');
      if (r && r.report && r.report.removed) toast(`${U.plural(r.report.removed, 'ocorrência futura editada antes foi substituída', 'ocorrências futuras editadas antes foram substituídas')}.`);
    }, 'Alteração salva.'),
  });
};

// Exclusão com impacto explicado
function askDelete(type, id, name) {

    ? `<p>${h(name)} tem vínculos:</p><ul>${L.map((x) => `<li>${U.plural(x.count, x.label.replace(/s$/, ''), x.label)}</li>`).join('')}</ul><p>Se excluir, esses registros continuam existindo, mas perdem a ligação. ${type === 'series' ? 'As ocorrências futuras ainda não registradas deixam de aparecer.' : ''} <strong>Arquivar</strong> mantém tudo e só esconde dos cadastros ativos.</p>`

}

/* ---------- Lista de lançamentos por natureza ---------- */
function entriesView(nature) {
  const T = E.today();
  const f = UI.filters[nature] = UI.filters[nature] || { month: U.monthKey(T), status: '', cat: UI.filters.cat || '', q: '', kind: '' };
  if (UI.filters.cat) { f.cat = UI.filters.cat; UI.filters.cat = null; }
  const d = data();
  let items = d.items.filter((it) => it.month === f.month && it.status !== undefined && ((it.nature === nature && ['receita', 'despesa', 'credito'].includes(it.type)) || (it.type === 'transferencia' && it.pnl.some((p) => p.nature === nature)) || (it.type === 'fatura' && it.src === 'entry' && nature === 'pessoal')));
  let cardRows = d.cardRows.filter((r) => r.nature === nature && r.month === f.month);
  if (f.status) { items = items.filter((i) => i.status === f.status); cardRows = cardRows.filter((r) => r.status === f.status); }
  if (f.cat) { items = items.filter((i) => i.categoryId === f.cat); cardRows = cardRows.filter((r) => r.categoryId === f.cat); }
  if (f.kind) { items = items.filter((i) => i.type === f.kind || (f.kind === 'cartao' && false)); if (f.kind !== 'despesa') cardRows = []; }
  if (f.q) { const q = U.norm(f.q); items = items.filter((i) => U.norm(i.desc).includes(q)); cardRows = cardRows.filter((r) => U.norm(r.desc).includes(q)); }
  const months = U.monthRange(U.addMonthKey(U.monthKey(E.orgStart(S)), 0), U.addMonthKey(U.monthKey(T), 12));
  if (!months.includes(f.month)) months.unshift(f.month);
  const series = S.series.filter((s) => s.nature === nature && !s.archived);
  const totIn = U.sum(items, (i) => Math.max(0, i.cash.reduce((a, c) => a + c.delta, 0)));
  const totOut = U.sum(items.filter((i) => i.type !== 'transferencia'), (i) => Math.max(0, -i.cash.reduce((a, c) => a + c.delta, 0))) + U.sum(cardRows, (r) => r.amount);
  return `
  <div class="toolbar">
    <label class="sel"><span class="sr">Mês</span><select data-chg="filt" data-nat="${nature}" data-f="month">${months.map((m) => `<option value="${m}" ${m === f.month ? 'selected' : ''}>${U.fmtMonthFull(m)}</option>`).join('')}</select></label>

function monthPicker(key, months) {
  const cur = UI.filters[key] || U.monthKey(E.today());
  return `<label class="sel"><span class="sr">Mês</span><select data-chg="setFilter" data-key="${key}">${months.map((m) => `<option value="${m}" ${m === cur ? 'selected' : ''}>${U.fmtMonthFull(m)}</option>`).join('')}</select></label>`;
}
CHG.setFilter = (v, el) => { UI.filters[el.dataset.key] = el.type === 'checkbox' ? el.checked : v; render(); };
const monthsAround = () => U.monthRange(U.monthKey(E.orgStart(S)) < U.monthKey(E.today()) ? U.monthKey(E.orgStart(S)) : U.monthKey(E.today()), U.addMonthKey(U.monthKey(E.today()), 12));

function proSummary() {
  const T = E.today();
  const m = UI.filters.proMonth || U.monthKey(T);
  const d = data();
  const r = E.results(S, d, 'profissional', [m]);
  const bal = E.balances(S, d);
  const nextMonths = U.monthRange(U.monthKey(T), U.addMonthKey(U.monthKey(T), 5));
  const bars = nextMonths.map((k) => { const x = E.results(S, d, 'profissional', [k]); return { label: U.fmtMonth(k).slice(0, 3), in: x.receita.total, out: x.despesa.total }; });
  const proj = E.projection(S, { to: U.addDays(T, 90), nature: 'profissional', data: d });
  const cats = Object.values(r.byCategory).sort((a, b) => b.total - a.total).map((c) => ({ label: c.name, value: c.total, limit: c.limit }));
  const late = d.items.filter((i) => i.src === 'client' && i.status === 'vencido' || (i.src === 'entry' && i.type === 'receita' && i.nature === 'profissional' && i.status === 'vencido'));
  const ending = S.clients.filter((c) => !c.archived && c.status === 'ativo' && c.endDate && c.endDate >= T && U.diffDays(T, c.endDate) <= (S.settings.contractAlertDays || 60));
  const byCert = r.byCertainty;
  return `<div class="toolbar">${monthPicker('proMonth', monthsAround())}</div>
  <section class="kpis">
    ${kpi('Faturamento recebido', money(r.receita.pago), `previsto no mês: ${money(r.receita.total)}`)}
    ${kpi('Despesas operacionais', money(r.despesa.total), `pagas ${money(r.despesa.pago)}, a pagar ${money(r.despesa.previsto + r.despesa.vencido)}`)}
    ${kpi('Resultado operacional', money(r.resultado), 'faturamento menos despesas profissionais, sem retiradas nem dívidas pessoais', r.resultado < 0 ? 'bad' : '')}
    ${kpi('Caixa profissional hoje', money(bal.byNature.profissional), 'saldo atribuído ao profissional; não é o mesmo que lucro')}
  </section>
  <div class="two">
    <div class="card"><h2>Origem do faturamento do mês</h2>
      <dl class="dl compact"><dt>Contratado (clientes)</dt><dd>${money(byCert.contratado || 0)}</dd><dt>Pontual confirmado</dt><dd>${money(byCert.confirmado || 0)}</dd><dt>Estimado</dt><dd>${money(byCert.estimado || 0)}</dd><dt>Em atraso</dt><dd class="${r.receita.vencido ? 'txt-bad' : ''}">${money(r.receita.vencido)}</dd></dl>
      <p class="muted small">Hipóteses de venda ficam no simulador e na meta. Elas não entram aqui.</p></div>
    <div class="card"><h2>Retiradas e circulação</h2>
      <dl class="dl compact"><dt>Retiradas para o pessoal</dt><dd>${money(r.retirada.total)}</dd><dt>Das quais implícitas</dt><dd>${money(r.implicitRetirada)}</dd><dt>Dinheiro pessoal usado aqui</dt><dd>${money(r.aporte_recebido.total)}</dd></dl>
      ${explain('proImpl', 'O que é retirada implícita?', '<p>Quando uma conta pessoal é paga com a conta PJ, ou um cliente paga na conta pessoal, o dinheiro saiu do profissional para o pessoal sem uma transferência. O painel registra isso como retirada, sem reduzir o resultado operacional. Para corrigir, edite a conta ou a natureza do lançamento.</p>')}</div>
  </div>
  <section class="card"><h2>Próximos 6 meses</h2><p class="muted small">Faturamento previsto (contratado, pontual e estimado) e despesas profissionais por mês. Meses após o fim de um contrato já mostram a redução.</p>${barsChart(bars)}</section>
  <section class="card"><h2>Caixa profissional nos próximos 90 dias</h2>${partialBanner(proj.partial)}${lineChart(proj.days)}<p class="small">Menor saldo: <strong>${money(proj.minBal)}</strong> em ${U.fmtDate(proj.minDate)}${proj.firstNeg ? ` · <span class="txt-bad">${icon('warn')} falta prevista em ${U.fmtDate(proj.firstNeg)}</span>` : ''}${proj.overdueRecv.length ? ` · ${money(U.sum(proj.overdueRecv, (x) => x.amount))} em atraso fora da projeção` : ''}</p></section>
  <div class="two">
    <section class="card"><h2>Pagamentos atrasados de clientes</h2><div class="list">${late.length ? late.map((i) => itemRow(i)).join('') : emptyState('Nenhum recebimento atrasado.')}</div></section>
    <section class="card"><h2>Contratos terminando</h2><div class="list">${ending.length ? ending.map((c) => `<button class="row" data-act="editClient" data-id="${c.id}"><div class="row-main"><span class="row-t">${h(c.name)}</span><span class="row-s">termina em ${U.fmtDate(c.endDate)} · renovação ${c.renewal === 'confirmada' ? 'confirmada' : 'não confirmada'}</span></div><strong class="row-amt">${money(E.clientAmountAt(c, c.endDate))}</strong></button>`).join('') : emptyState(`Nenhum contrato termina nos próximos ${S.settings.contractAlertDays || 60} dias.`)}</div></section>
  </div>
  <section class="card"><h2>Despesas por categoria em ${U.fmtMonth(m)}</h2>${hbars(cats, r.receita.total || null)}${r.receita.total ? '<p class="muted small">Percentual sobre o faturamento previsto do mês.</p>' : ''}</section>`;
}

/* ---------- Clientes ---------- */
function clientsView() {
  const T = E.today();
  const showArch = UI.filters.clientsArch;
  const list = S.clients.filter((c) => !!c.archived === !!showArch);
  const d = data();
  const monthly = U.sum(S.clients.filter((c) => !c.archived && c.status === 'ativo' && (!c.endDate || c.endDate >= T)), (c) => Math.round(E.clientAmountAt(c, T) * E.monthlyFactor(c.frequency)));
  return `<div class="sumline"><span>Receita contratada ativa: <strong>${money(monthly)}</strong> por mês</span><span>${U.plural(S.clients.filter((c) => !c.archived && c.status === 'ativo').length, 'cliente ativo', 'clientes ativos')}</span></div>
  <div class="actions"><button class="btn primary" data-act="newClient">${icon('plus')}Novo cliente</button><label class="check-inline"><input type="checkbox" data-chg="setFilter" data-key="clientsArch" ${showArch ? 'checked' : ''}> Mostrar arquivados</label></div>
  <div class="card list">${list.length ? list.map((c) => {
    const late = d.items.filter((i) => i.src === 'client' && i.id === c.id && i.status === 'vencido');
    const next = d.items.find((i) => i.src === 'client' && i.id === c.id && i.status === 'previsto');
    const svc = S.services.find((s) => s.id === c.serviceId);
    const ending = c.endDate && c.endDate >= T && U.diffDays(T, c.endDate) <= (S.settings.contractAlertDays || 60);
    const pendingAdj = (c.adjustments || []).filter((a) => !a.confirmed && a.date >= T);
    return `<button class="row" data-act="editClient" data-id="${c.id}" id="rec-${c.id}"><div class="row-main"><span class="row-t">${h(c.name)}</span><span class="row-s">${svc ? h(svc.name) + ' · ' : ''}${E.FREQ_LABEL[c.frequency || 'mensal']}, vence dia ${c.dueDay} · desde ${U.fmtDate(c.startDate)}${c.endDate ? ` até ${U.fmtDate(c.endDate)}` : ', sem término'}${next ? ` · próxima em ${U.fmtDate(next.date)}` : ''}</span><span class="row-tags"><span class="pill cl-${c.status}">${{ ativo: 'Ativo', pausado: 'Pausado', encerrado: 'Encerrado' }[c.status] || c.status}</span>${late.length ? `<span class="pill st-vencido">${icon('alert')}${U.plural(late.length, 'atraso', 'atrasos')}</span>` : ''}${ending ? `<span class="pill warn">${icon('clock')}termina em ${U.diffDays(T, c.endDate)} dias</span>` : ''}${pendingAdj.length ? `<span class="pill soft">reajuste previsto ${U.fmtDate(pendingAdj[0].date)}</span>` : ''}${c.endDate && c.renewal !== 'confirmada' && c.endDate >= T ? '<span class="pill soft">renovação não confirmada</span>' : ''}</span></div><strong class="row-amt">${money(E.clientAmountAt(c, T))}</strong></button>`;
  }).join('') : emptyState(showArch ? 'Nenhum cliente arquivado.' : 'Nenhum cliente cadastrado. Cadastre suas mensalidades para ver o faturamento previsto.')}</div>`;
}
ACT.newClient = () => clientForm();
ACT.editClient = (d) => clientForm(S.clients.find((c) => c.id === d.id));
function clientForm(c) {
  const isNew = !c;
  const T = E.today();
  const v = c ? { ...c } : { status: 'ativo', frequency: 'mensal', startDate: T, dueDay: 10, renewal: 'sem_termino', accountId: S.settings.defaultProAccountId || (S.accounts.find((a) => a.type === 'pj')?.id || ''), categoryId: 'c_pro_mens' };
  const d = data();
  const adj = c ? (c.adjustments || []) : [];
  const recv = c ? d.items.filter((i) => (i.src === 'client' && i.id === c.id) || (i.src === 'entry' && i.ref.clientRef && i.ref.clientRef.id === c.id)).slice(0, 14) : [];
  const fields = [
    { k: 'name', label: 'Nome do cliente', type: 'text', req: true },
    { k: 'serviceId', label: 'Serviço', type: 'select', options: [['', 'Sem serviço vinculado'], ...S.services.filter((s) => !s.archived).map((s) => [s.id, `${s.name} (${money(s.price)})`])], half: true },
    { k: 'amount', label: 'Valor da mensalidade', type: 'money', req: true, min: 1, half: true, help: 'Para reajustes, use a lista abaixo; o histórico fica preservado.' },
    { k: 'startDate', label: 'Início do contrato', type: 'date', req: true, half: true },
    { k: 'endDate', label: 'Término do contrato', type: 'date', half: true, help: 'Vazio = sem data de término.' },
    { k: 'dueDay', label: 'Dia do vencimento', type: 'number', min: 1, max: 31, step: 1, req: true, half: true, help: 'Dia 31 em meses curtos vira o último dia.' },
    { k: 'frequency', label: 'Recorrência', type: 'select', options: [['mensal', 'Mensal'], ['bimestral', 'Bimestral'], ['trimestral', 'Trimestral'], ['semestral', 'Semestral'], ['anual', 'Anual']], half: true },
    { k: 'status', label: 'Status', type: 'chips', options: [['ativo', 'Ativo'], ['pausado', 'Pausado'], ['encerrado', 'Encerrado']] },
    { k: 'renewal', label: 'Renovação', type: 'chips', options: [['sem_termino', 'Sem término'], ['nao_confirmada', 'Não confirmada'], ['confirmada', 'Confirmada']], when: (x) => !!x.endDate, help: 'Renovação confirmada não estende sozinha o contrato: atualize a data de término quando assinar.' },
    { k: 'accountId', label: 'Conta que recebe', type: 'select', options: accOptions(), half: true },
    { k: 'categoryId', label: 'Categoria', type: 'select', options: catOptions('profissional', 'receita'), half: true },
    { k: 'notes', label: 'Observações', type: 'textarea' },
    { k: 'info', type: 'info', info: (x) => x.status === 'encerrado' && !x.endDate ? '<p class="muted small">Sem data de término, o encerramento vale a partir de hoje.</p>' : x.status === 'pausado' ? '<p class="muted small">Pausado: nenhuma mensalidade é gerada até reativar.</p>' : '' },
  ];
  const extra = c ? `<h3 class="sec">Reajustes</h3>${adj.length ? `<ul class="mini">${adj.map((a) => `<li><strong>${money(a.amount)} a partir de ${U.fmtDate(a.date)}</strong><small>${a.confirmed ? 'confirmado, já entra nas projeções' : 'previsto, ainda não entra nas projeções'} · <button class="link" data-act="toggleAdj" data-id="${c.id}" data-adj="${a.id || a.date}">${a.confirmed ? 'marcar como não confirmado' : 'confirmar'}</button> · <button class="link danger-txt" data-act="delAdj" data-id="${c.id}" data-adj="${a.id || a.date}">remover</button></small></li>`).join('')}</ul>` : '<p class="muted small">Nenhum reajuste registrado.</p>'}<button class="btn ghost" data-act="addAdj" data-id="${c.id}">${icon('plus')}Reajuste</button>
    <h3 class="sec">Mensalidades</h3><div class="list">${recv.length ? recv.map((i) => itemRow(i)).join('') : '<p class="muted small">Nenhuma mensalidade no período.</p>'}</div>` : '';
  const wrap = openForm({
    title: isNew ? 'Novo cliente' : c.name, fields, values: v, wide: true,
    validate: (x) => x.endDate && x.endDate < x.startDate ? { endDate: 'O término precisa ser depois do início.' } : null,
    extraButtons: c ? [{ id: 'arch', label: c.archived ? 'Desarquivar' : 'Arquivar', onClick: () => commit((st) => { const x = st.clients.find((y) => y.id === c.id); x.archived = !x.archived; }, c.archived ? 'Cliente reativado.' : 'Cliente arquivado. O histórico foi mantido.') }, { id: 'del', label: 'Excluir', cls: 'ghost danger-txt', onClick: () => askDelete('client', c.id, c.name) }] : [],
    onSubmit: (x) => commit((st) => {
      const obj = { name: x.name, serviceId: x.serviceId, amount: x.amount, startDate: x.startDate, endDate: x.endDate, dueDay: x.dueDay, frequency: x.frequency, status: x.status, renewal: x.endDate ? x.renewal || 'nao_confirmada' : 'sem_termino', accountId: x.accountId, categoryId: x.categoryId, notes: x.notes };
      if (x.status === 'encerrado' && !x.endDate) obj.endDate = E.today();
      if (isNew) st.clients.push({ id: U.uid('cl_'), adjustments: [], createdAt: Date.now(), ...obj });
      else Object.assign(st.clients.find((y) => y.id === c.id), obj);
    }, isNew ? 'Cliente cadastrado.' : 'Cliente atualizado.'),
  });
  if (extra) wrap.querySelector('.form-err').insertAdjacentHTML('beforebegin', `<div class="sub">${extra}</div>`);
  const sel = wrap.querySelector('[name=serviceId]');
  if (sel) sel.addEventListener('change', () => { const s = S.services.find((y) => y.id === sel.value); const a = wrap.querySelector('[name=amount]'); if (s && !a.value) a.value = U.moneyInput(s.price); });
}
ACT.addAdj = (d) => {
  const c = S.clients.find((x) => x.id === d.id);
  openForm({ title: 'Reajuste de ' + c.name, fields: [{ k: 'date', label: 'Vale a partir de', type: 'date', req: true, half: true }, { k: 'amount', label: 'Novo valor', type: 'money', req: true, min: 1, half: true }, { k: 'confirmed', label: 'Reajuste já confirmado com o cliente', type: 'check' }], values: { date: E.today(), amount: c.amount, confirmed: false },
    onSubmit: (v) => commit((st) => { const x = st.clients.find((y) => y.id === c.id); x.adjustments = x.adjustments || []; x.adjustments.push({ id: U.uid('a_'), date: v.date, amount: v.amount, confirmed: v.confirmed }); }, 'Reajuste registrado.', { keepModal: false }) });
};
const adjMatch = (a, key) => (a.id || a.date) === key;
ACT.toggleAdj = (d) => commit((st) => { const a = st.clients.find((y) => y.id === d.id).adjustments.find((x) => adjMatch(x, d.adj)); a.confirmed = !a.confirmed; }, 'Reajuste atualizado.');
ACT.delAdj = (d) => commit((st) => { const c = st.clients.find((y) => y.id === d.id); c.adjustments = c.adjustments.filter((x) => !adjMatch(x, d.adj)); }, 'Reajuste removido.');

ACT.editService = (d) => serviceForm(S.services.find((s) => s.id === d.id));
function serviceForm(s) {
  openForm({
    title: s ? s.name : 'Novo serviço ou produto',

/* ---------- Meta e retirada ---------- */
function goalView() {
  const T = E.today();
  const m = UI.filters.goalMonth || U.monthKey(T);
  const d = data();
  const r = E.results(S, d, 'profissional', [m]);
  const goal = S.settings.proGoal;
  const have = (r.byCertainty.contratado || 0) + (r.byCertainty.confirmado || 0);
  const est = r.byCertainty.estimado || 0;
  const gap = goal ? Math.max(0, goal - have) : null;
  const svcs = S.services.filter((s) => !s.archived && s.price > 0).sort((a, b) => b.price - a.price);
  let combos = '';
  if (goal && gap > 0) {
    if (!svcs.length) combos = '<p class="muted">Cadastre serviços com preço para ver combinações.</p>';
    else {
      const singles = svcs.map((s) => `<li><strong>${Math.ceil(gap / s.price)} × ${h(s.name)}</strong> <small class="muted">(${money(Math.ceil(gap / s.price) * s.price)})</small></li>`);
      const mixes = [];
      if (svcs.length >= 2) {
        const [a, b] = svcs;
        const maxA = Math.ceil(gap / a.price);
        for (let i = 1; i < maxA && mixes.length < 3; i++) { const rest = gap - i * a.price; if (rest <= 0) break; const j = Math.ceil(rest / b.price); mixes.push(`<li><strong>${i} × ${h(a.name)} + ${j} × ${h(b.name)}</strong> <small class="muted">(${money(i * a.price + j * b.price)})</small></li>`); }
      }
      combos = `<ul class="mini">${singles.concat(mixes).join('')}</ul><p class="muted small">Quantidades arredondadas para cima, com seus preços cadastrados. São hipóteses: não entram na previsão real. Para testar o efeito no caixa, use o simulador.</p>`;
    }
  }
  const days = UI.filters.wdDays || S.settings.withdrawDays || 30;
  const w = E.withdrawSuggestion(S, { days });
  const adj = UI.filters.wdAmount != null ? UI.filters.wdAmount : w.suggested;
  const imp = adj > 0 ? E.withdrawImpact(S, adj, T) : null;
  return `<div class="two">
  <section class="card"><h2>${icon('target')}Meta mensal de faturamento</h2>
    <div class="toolbar">${monthPicker('goalMonth', monthsAround())}<button class="btn ghost" data-act="editGoal">${goal ? 'Alterar meta' : 'Definir meta'}</button></div>
    ${goal ? `<dl class="dl compact"><dt>Meta</dt><dd>${money(goal)}</dd><dt>Contratado e pontual confirmado</dt><dd>${money(have)}</dd><dt>Estimado (não garantido)</dt><dd>${money(est)}</dd><dt>Falta faturar</dt><dd><strong class="${gap > 0 ? 'txt-warn' : 'txt-good'}">${gap > 0 ? money(gap) : 'meta atingida'}</strong></dd></dl>${progressBar(have / goal, 'Progresso da meta')}
    ${gap > 0 ? `<h3 class="sec">Combinações possíveis para fechar ${money(gap)}</h3>${combos}` : ''}` : emptyState('Defina uma meta para ver quanto falta e as combinações de vendas.')}
  </section>
  <section class="card"><h2>${icon('swap')}Retirada pessoal sugerida</h2>
    <div class="toolbar"><label class="sel"><span class="sr">Período</span><select data-chg="setFilter" data-key="wdDays">${[30, 60, 90].map((x) => `<option value="${x}" ${+days === x ? 'selected' : ''}>Próximos ${x} dias</option>`).join('')}</select></label><button class="btn ghost" data-act="editBuffer">Colchão de segurança</button></div>
    <div class="big-num ${w.safe ? '' : 'txt-warn'}">${w.safe ? money(w.suggested) : 'Sem margem segura'}</div>
    <p class="small">${w.safe ? `É o maior valor que pode sair hoje sem deixar o caixa profissional abaixo do colchão até ${U.fmtDate(w.to)}, com o que está cadastrado.` : 'Com os dados cadastrados, qualquer retirada agora deixaria o caixa profissional abaixo do colchão de segurança em algum momento do período.'}</p>
    ${explain('wdCalc', 'Ver o cálculo', `<dl class="dl compact"><dt>Caixa profissional hoje</dt><dd>${money(w.cash)}</dd><dt>+ Entradas contratadas e confirmadas até ${U.fmtDate(w.to)}</dt><dd>${money(w.inflow)}</dd><dt>− Saídas profissionais previstas (inclui retiradas já planejadas e aportes)</dt><dd>${money(w.outflow)}</dd><dt>− Colchão de segurança</dt><dd>${money(w.buffer)}</dd><dt>= Sobra no fim do período</dt><dd>${money(w.margin)}</dd><dt>Menor saldo no caminho, menos colchão</dt><dd>${money(w.minMargin)} (${U.fmtDate(w.minDate)})</dd></dl><p class="muted small">A sugestão é o menor dos dois últimos valores. Entradas estimadas (${money(w.estIn)}) não foram consideradas. Colchão: ${S.settings.proBufferMode === 'valor' ? 'valor fixo definido por você' : `${S.settings.proBufferMonths ?? 1} mês(es) de custos fixos profissionais (${money(w.fixed)} por mês)`}.</p>${w.notes.length ? `<p class="txt-warn small">${w.notes.join(' ')}</p>` : ''}`)}
    <div class="field"><label for="wd_amt">Ajustar valor da retirada</label><div class="money-in"><span>R$</span><input id="wd_amt" inputmode="decimal" value="${U.moneyInput(adj)}" data-chg="wdAmount"></div></div>
    ${imp ? `<dl class="dl compact"><dt>Menor saldo profissional em 90 dias</dt><dd>${money(imp.before.minBal)} para <strong class="${imp.after.minBal < 0 ? 'txt-bad' : ''}">${money(imp.after.minBal)}</strong></dd><dt>Primeira falta no profissional</dt><dd>${imp.after.firstNeg ? `<span class="txt-bad">${U.fmtDate(imp.after.firstNeg)}</span>` : 'nenhuma'}</dd><dt>Menor saldo pessoal em 90 dias</dt><dd>${money(imp.beforePes.minBal)} para ${money(imp.afterPes.minBal)}</dd></dl>
    <button class="btn primary" data-act="planWithdraw" data-amount="${adj}">Registrar esta retirada</button>` : '<p class="muted small">Cadastre uma conta PJ e uma pessoal para ver o impacto.</p>'}
  </section></div>`;
}

function limitsView() {
  const T = E.today();
  const d = data();
  const months = [U.monthKey(T), U.addMonthKey(U.monthKey(T), 1), U.addMonthKey(U.monthKey(T), 2)];
  const com = E.commitment(S, d, months);
  const renda = Math.round(com.renda / 3);
  const fixedOut = Math.round((com.essenciais + com.cartoes + com.dividas) / 3);
  const free = renda - fixedOut;
  const cats = S.categories.filter((c) => c.nature === 'pessoal' && c.kind === 'despesa' && !c.archived && !c.system);
  const nonEss = cats.filter((c) => !c.essential);
  const r = E.results(S, d, 'pessoal', months);
  const spentBy = (id) => Math.round((r.byCategory[id]?.total || 0) / 3);
  const totalNE = U.sum(nonEss, (c) => spentBy(c.id));
  let sugg = {};
  if (free > 0 && nonEss.length) {
    for (const c of nonEss) {
      const share = totalNE > 0 ? spentBy(c.id) / totalNE : 1 / nonEss.length;
      sugg[c.id] = Math.floor(free * 0.8 * share / 1000) * 1000;
    }
  }
  return `<section class="card"><h2>Base para sugerir limites</h2>
    <dl class="dl compact"><dt>Entradas pessoais médias por mês</dt><dd>${money(renda)}</dd><dt>Essenciais, cartões e dívidas por mês</dt><dd>${money(fixedOut)}</dd><dt>Sobra para os demais gastos</dt><dd><strong class="${free < 0 ? 'txt-bad' : ''}">${money(free)}</strong></dd></dl>
    <p class="muted small">Média de ${months.map(U.fmtMonth).join(', ')}, com o que está cadastrado (pago e previsto).</p>
    ${free <= 0 ? `<div class="banner warn">${icon('warn')}<div>As obrigações cadastradas já superam as entradas em ${money(-free)} por mês. Antes de pensar em limites, reserva ou investimento, o ponto é cobrir esse déficit: veja o plano de ação e as dívidas.</div></div>` : `<p class="small">Sugestão: até 80% da sobra distribuída entre as categorias não essenciais, na proporção do que você já gasta nelas (ou por igual, se ainda não houver gastos). Os outros 20% ficam livres para imprevistos ou para o plano de dívidas e reservas. Não é uma regra pronta: ajuste como fizer sentido.</p>`}
  </section>
  <section class="card"><h2>Limites mensais</h2><div class="list">${cats.map((c) => `<div class="row static"><div class="row-main"><span class="row-t">${h(c.name)} ${c.essential ? '<span class="pill soft">essencial</span>' : ''}</span><span class="row-s">média atual ${money(spentBy(c.id))}${sugg[c.id] ? ` · sugestão ${money(sugg[c.id])}` : ''}</span></div><div class="row-act"><strong>${c.limit != null ? money(c.limit) : '<span class="muted">sem limite</span>'}</strong><button class="btn ghost sm" data-act="setLimit" data-id="${c.id}" data-sug="${sugg[c.id] || ''}">${c.limit != null ? 'Alterar' : 'Definir'}</button></div></div>`).join('')}</div>
  ${Object.keys(sugg).length ? `<div class="actions"><button class="btn ghost" data-act="applySugg" data-s='${h(JSON.stringify(sugg))}'>Aplicar sugestões nas categorias sem limite</button></div>` : ''}</section>`;
}
ACT.setLimit = (d) => {
  const c = S.categories.find((x) => x.id === d.id);
  openForm({ title: 'Limite: ' + c.name, fields: [{ k: 'limit', label: 'Limite mensal (vazio = sem limite)', type: 'money', min: 0 }, { k: 'info', type: 'info', info: () => d.sug ? `<p class="muted small">Sugestão calculada: ${money(+d.sug)}.</p>` : '' }], values: { limit: c.limit ?? (d.sug ? +d.sug : null) }, onSubmit: (v) => commit((st) => { st.categories.find((x) => x.id === d.id).limit = v.limit; }, 'Limite salvo.') });
};
ACT.applySugg = (d) => { const s = JSON.parse(d.s); commit((st) => { for (const [id, v] of Object.entries(s)) { const c = st.categories.find((x) => x.id === id); if (c && c.limit == null && v > 0) c.limit = v; } }, 'Sugestões aplicadas. Todas podem ser editadas.'); };

function debtCard(x) {
  const d = x.d;
  const tags = [];
  if (x.overdue) tags.push(`<span class="pill st-vencido">${icon('alert')}Em atraso</span>`);
  if (x.growing) tags.push(`<span class="pill bad">${icon('up')}Crescendo</span>`);
  if (x.linked) tags.push(`<span class="pill soft">${icon('card')}Vinculada a cartão</span>`);
  if (x.missing.length) tags.push(`<span class="pill warn">Faltam dados</span>`);
  else if (x.stale) tags.push(`<span class="pill warn">Atualizar saldo</span>`);
  return `<button class="card debt" data-act="editDebt" data-id="${d.id}" id="rec-${d.id}"><div class="debt-h"><strong>${h(d.creditor)}</strong>${natChip(d.nature || 'pessoal')}</div>
  <span class="debt-type">${(DEBT_TYPES.find((t) => t[0] === d.type) || [0, 'Dívida'])[1]}</span>
  <span class="big-num">${x.balance == null ? '<span class="muted">saldo não informado</span>' : money(x.balance)}</span>
  <small class="muted">${h(x.basis)}</small>
  <dl class="dl compact">${x.pay ? `<dt>${d.installmentAmount ? 'Parcela' : 'Mínimo'}</dt><dd>${money(x.pay)}</dd>` : ''}${x.remainingInst != null ? `<dt>Parcelas restantes</dt><dd>${x.remainingInst}</dd>` : ''}${x.nextDue ? `<dt>Próximo vencimento</dt><dd>${U.fmtDate(x.nextDue)}</dd>` : ''}<dt>Juros</dt><dd>${x.monthlyRate != null ? `${U.pct(x.monthlyRate, 2)} ao mês${x.monthlyInterest ? `, cerca de ${money(x.monthlyInterest)}` : ''}` : 'não informados'}</dd></dl>
  <span class="row-tags">${tags.join('')}</span></button>`;
}

function debtForm(debt) {

  const linkedElsewhere = new Set(S.debts.filter((x) => x !== debt && x.status === 'ativa').flatMap((x) => x.linkedPurchaseIds || []));
  const fields = [

/* ---------- Plano de quitação ---------- */
function payoffView() {
  const d = data();
  const cap = E.debtCapacity(S);
  const active = S.debts.filter((x) => x.status === 'ativa').map((x) => E.debtInfo(S, d, x));
  const contractual = U.sum(active, (x) => x.pay || 0);
  const suggested = contractual + cap.extra;
  const budget = S.settings.debtBudget ?? suggested;
  const av = E.payoff(S, d, budget, 'juros');
  const sb = E.payoff(S, d, budget, 'saldo');
  const noData = active.filter((x) => x.balance == null);
  const res = (p, title, desc) => {
    if (p.empty) return `<div class="card"><h3>${title}</h3><p class="muted">Sem dívidas com saldo conhecido para simular.</p></div>`;
    if (p.infeasible) return `<div class="card"><h3>${title}</h3><p class="txt-bad">O valor mensal (${money(budget)}) é menor que os pagamentos contratuais (${money(p.needed)}).</p></div>`;
    return `<div class="card"><h3>${title}</h3><p class="muted small">${desc}</p><dl class="dl compact"><dt>Prazo estimado</dt><dd>${p.done ? U.plural(p.months, 'mês', 'meses') : 'mais de 30 anos'}</dd><dt>Desembolso total</dt><dd>${money(p.totalPaid)}</dd><dt>Juros estimados</dt><dd>${money(p.totalInterest)}</dd></dl><ol class="mini">${p.debts.slice().sort((a, b) => (a.paidMonth || 999) - (b.paidMonth || 999)).map((x) => `<li><strong>${h(x.name)}</strong><small>${x.paidMonth ? `quitada no mês ${x.paidMonth}` : 'não quitada no período'}${x.rKnown ? '' : ' · juros desconhecidos'}</small></li>`).join('')}</ol></div>`;
  };
  return `<section class="card"><h2>Quanto dá para pagar por mês</h2>
    ${cap.deficit ? `<div class="banner warn">${icon('warn')}<div>Nos próximos 90 dias, as saídas pessoais cadastradas (${money(cap.outflow)}) ${cap.net < 0 ? `superam as entradas (${money(cap.inflow)}) em ${money(-cap.net)}` : `deixam o saldo pessoal negativo em algum momento (menor saldo ${money(cap.minBal)} em ${U.fmtDate(cap.minDate)})`}. Não há valor extra seguro para antecipar dívidas agora. Prioridades: completar os dados que faltam, cortar gastos que não são essenciais e avaliar negociação das dívidas mais caras ou em atraso.</div></div>` : ''}
    <dl class="dl compact"><dt>Entradas pessoais previstas em 90 dias</dt><dd>${money(cap.inflow)}</dd><dt>Saídas pessoais previstas em 90 dias</dt><dd>${money(cap.outflow)}</dd><dt>Das quais pagamentos contratuais de dívidas</dt><dd>${money(cap.contractual)}</dd><dt>Sobra média por mês</dt><dd>${money(cap.avg)}</dd><dt>Menor saldo pessoal no período</dt><dd>${money(cap.minBal)}</dd><dt>Valor extra possível por mês</dt><dd><strong>${money(cap.extra)}</strong></dd></dl>
    <p class="muted small">O extra é o menor valor entre a sobra média e o menor saldo do período, para não deixar faltar dinheiro. Inclui só o que está cadastrado. Se você também guarda para reserva ou objetivos, essa sobra precisa ser dividida: a mesma sobra não paga as duas coisas.</p>
    <div class="toolbar"><span>Valor mensal para dívidas: <strong>${money(budget)}</strong>${S.settings.debtBudget == null ? ' (sugerido: contratual + extra)' : ' (definido por você)'}</span><button class="btn ghost" data-act="editDebtBudget" data-sug="${suggested}">Ajustar</button></div></section>
  ${noData.length ? `<div class="banner soft">${icon('info')}<span>Fora da simulação por falta de saldo: ${noData.map((x) => h(x.d.creditor)).join(', ')}.</span></div>` : ''}
  <div class="two">${res(av, 'Priorizar juros maiores', 'O valor extra vai primeiro para a dívida com a maior taxa conhecida.')}${res(sb, 'Priorizar menores saldos', 'O valor extra vai primeiro para a dívida com o menor saldo, liberando parcelas mais cedo.')}</div>
  ${(av.notes || []).length ? `<p class="muted small">${[...new Set([...(av.notes || []), ...(sb.notes || [])])].map(h).join(' ')}</p>` : ''}
  <p class="muted small">Em ambas as estratégias as parcelas e mínimos contratuais continuam sendo pagos. As estimativas consideram juros compostos mensais sobre o saldo informado; não são o cálculo exato do credor. Nenhuma das estratégias é sempre melhor: compare prazo, custo e o alívio de parcelas.</p>`;
}
ACT.editDebtBudget = (d) => openForm({ title: 'Valor mensal para dívidas', fields: [{ k: 'debtBudget', label: 'Valor por mês (vazio = usar sugestão)', type: 'money', min: 0 }, { k: 'i', type: 'info', info: () => `<p class="muted small">Sugestão atual: ${money(+d.sug)}.</p>` }], values: { debtBudget: S.settings.debtBudget }, onSubmit: (v) => commit((st) => { st.settings.debtBudget = v.debtBudget; }, 'Valor salvo.') });

    <div class="grid-f">

  render();
};

function cardStats(card, d) {
  const T = E.today();
  const invs = Object.values(d.invoices).filter((i) => i.cardId === card.id && i.status !== 'anterior').sort((a, b) => (a.month < b.month ? -1 : 1));
  const open = invs.filter((i) => i.remaining > 0);
  const next = open[0];
  const remainingTotal = U.sum(open, (i) => i.remaining);
  const lastMonth = invs.filter((i) => i.items.length).map((i) => i.month).pop() || null;
  const goalStart = S.settings.cardGoalStart || E.orgStart(S);
  const newPurch = S.purchases.filter((p) => p.cardId === card.id && p.status !== 'cancelada' && p.mode !== 'restante' && p.date >= goalStart);
  return { invs, open, next, remainingTotal, lastMonth, newPurch };
}

function cardsView() {
  const d = data();
  const cards = S.cards.filter((c) => !c.archived);
  const months = U.monthRange(U.monthKey(E.today()), U.addMonthKey(U.monthKey(E.today()), 11));
  const bars = months.map((m) => ({ label: U.fmtMonth(m).slice(0, 3), in: 0, out: U.sum(Object.values(d.invoices).filter((i) => i.month === m && i.status !== 'anterior'), (i) => i.remaining) }));
  return `<div class="actions"><button class="btn primary" data-act="newCard">${icon('plus')}Novo cartão</button><button class="btn ghost" data-act="newPurchase">${icon('plus')}Compra</button><button class="btn ghost" data-act="newPurchase" data-old="1">${icon('plus')}Parcelas restantes de compra antiga</button></div>
  <div class="cards-grid">${cards.length ? cards.map((c) => {
    const s = cardStats(c, d);
    const isMom = c.owner === 'mae';
    const endM = c.endMonth || (isMom ? '2027-02' : null);
    const avoid = c.avoid || (S.settings.avoidCardIds || []).includes(c.id);
    return `<div class="card ccard ${isMom ? 'mom' : ''}" id="rec-${c.id}"><div class="debt-h"><strong>${h(c.name)}</strong>${isMom ? '<span class="pill soft">cartão da mãe</span>' : ''}${avoid ? `<span class="pill warn">${icon('target')}deixar de usar</span>` : ''}</div>
