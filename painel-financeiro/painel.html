ACT.purchase = (d) => { const p = S.purchases.find((x) => x.id === d.id); if (!p) return; closeAllModals(); if (p.kind === 'pix_credito') return pixForm(p); purchaseForm(p); };
function purchaseForm(p, { old = false } = {}) {
  if (!S.cards.filter((c) => !c.archived).length) { toast('Cadastre um cartão primeiro.', 'erro'); go('cartoes', 'cartoes'); return; }
  const isNew = !p;
  const T = E.today();
  const v = p ? { ...p, customText: p.customAmounts ? p.customAmounts.map(U.moneyInput).join('; ') : '' } : { cardId: cardOptions()[0][0], date: T, nature: 'pessoal', mode: old ? 'restante' : 'total', n: 1, paidBefore: 0, firstInvoice: null };
  if (!v.firstInvoice) { const c = S.cards.find((x) => x.id === v.cardId); v.firstInvoice = old ? U.addMonthKey(U.monthKey(T), 1) : E.invoiceMonthFor(c, v.date); }
  const fields = [
    { k: 'cardId', label: 'Cartão', type: 'select', options: cardOptions(), half: true },
    { k: 'mode', label: 'Tipo de cadastro', type: 'chips', options: [['total', 'Compra nova (valor total)'], ['restante', 'Só o que falta pagar']], half: true },
    { k: 'description', label: 'Descrição', type: 'text', req: true },
    { k: 'date', label: 'Data da compra', type: 'date', req: true, half: true, help: 'Para compras antigas, pode ser aproximada.' },
    { k: 'nature', label: 'Natureza', type: 'chips', options: [['pessoal', 'Pessoal'], ['profissional', 'Profissional']], half: true },
    { k: 'categoryId', label: 'Categoria', type: 'select', dynamic: true, options: (x) => catOptions(x.nature, 'despesa') },
    { k: 'total', label: 'Valor total', type: 'money', min: 1, half: true, when: (x) => x.mode === 'total' },
    { k: 'n', label: 'Parcelas', type: 'number', min: 1, max: 48, step: 1, half: true, when: (x) => x.mode === 'total' },
    { k: 'installmentValue', label: 'Valor de cada parcela', type: 'money', min: 1, half: true, when: (x) => x.mode === 'restante' },
    { k: 'remaining', label: 'Parcelas que faltam', type: 'number', min: 1, max: 120, step: 1, half: true, when: (x) => x.mode === 'restante' },
    { k: 'paidBefore', label: 'Parcelas já pagas antes (só para numerar)', type: 'number', min: 0, step: 1, half: true, when: (x) => x.mode === 'restante' },
    { k: 'firstInvoice', label: 'Fatura da primeira parcela a pagar', type: 'month', req: true, half: true, help: 'Calculada pela data e pelo fechamento. Corrija se o emissor usou outro mês.' },
    { k: 'customText', label: 'Valores diferentes por parcela (opcional)', type: 'text', placeholder: 'Ex.: 150,10; 149,95; 149,95', help: 'Use quando o emissor distribuir os centavos de outro jeito. Deixe vazio para dividir igualmente.' },
    { k: 'notes', label: 'Observações', type: 'textarea' },
    { k: 'prev', type: 'info', info: (x) => {
      const pp = { ...x, kind: 'compra', status: 'ativa', customAmounts: parseCustom(x.customText) };
      if (!pp.firstInvoice) return '';
      const ins = E.purchaseInstallments(pp);
      if (!ins.length) return '';
      const card = S.cards.find((c) => c.id === x.cardId);
      return `<div class="banner soft">${icon('card')}<div>${ins.length === 1 ? `Parcela única de ${money(ins[0].amount)} na fatura de ${U.fmtMonth(ins[0].month)}` : `${ins.length} parcelas: ${money(ins[0].amount)}${ins[1] && ins[1].amount !== ins[0].amount ? ` (primeira) e ${money(ins[1].amount)}` : ' cada'}, de ${U.fmtMonth(ins[0].month)} a ${U.fmtMonth(ins[ins.length - 1].month)}`}. Total: ${money(U.sum(ins, (i) => i.amount))}. ${card && card.owner === 'mae' && card.endMonth && ins[ins.length - 1].month > card.endMonth ? `<strong>Termina depois de ${U.fmtMonth(card.endMonth)}, previsão do cartão.</strong>` : ''}</div></div>`;
    } },
  ];
  openForm({
    title: isNew ? (old ? 'Parcelas restantes' : 'Compra no cartão') : p.description, fields, values: v, wide: true,
    validate: (x) => {
      if (x.mode === 'total' && !(x.total > 0)) return { total: 'Informe o valor total.' };
      if (x.mode === 'restante' && (!(x.installmentValue > 0) || !(x.remaining > 0))) return { installmentValue: 'Informe o valor e quantas parcelas faltam.' };
      const c = parseCustom(x.customText);
      if (x.customText && !c) return { customText: 'Não consegui ler os valores. Separe com ponto e vírgula.' };
      const n = x.mode === 'total' ? (x.n || 1) : x.remaining;
      if (c && c.length !== n) return { customText: `Informe exatamente ${n} valores.` };
      if (c && x.mode === 'total' && U.sum(c) !== x.total) return { customText: `A soma (${money(U.sum(c))}) precisa ser igual ao total (${money(x.total)}).` };
      return null;
    },
    extraButtons: p ? [{ id: 'cancel', label: p.status === 'cancelada' ? 'Reativar' : 'Cancelar compra', onClick: () => commit((st) => { const x = st.purchases.find((y) => y.id === p.id); x.status = x.status === 'cancelada' ? 'ativa' : 'cancelada'; }, p.status === 'cancelada' ? 'Compra reativada.' : 'Compra cancelada. Ela sai das faturas futuras.') }, { id: 'del', label: 'Excluir', cls: 'ghost danger-txt', onClick: () => confirmBox({ title: 'Excluir compra?', body: '<p>A compra sai de todas as faturas, inclusive das já pagas, o que muda o histórico de despesas. Se ela foi estornada, prefira "Cancelar compra".</p>', danger: true, confirmLabel: 'Excluir', onConfirm: () => { closeAllModals(); commit((st) => A.remove(st, 'purchase', p.id), 'Compra excluída.'); } }) }] : [],
    onSubmit: (x) => commit((st) => {
      const obj = { cardId: x.cardId, mode: x.mode, description: x.description, date: x.date, nature: x.nature, categoryId: x.categoryId, total: x.mode === 'total' ? x.total : null, n: x.mode === 'total' ? (x.n || 1) : null, installmentValue: x.mode === 'restante' ? x.installmentValue : null, remaining: x.mode === 'restante' ? x.remaining : null, paidBefore: x.mode === 'restante' ? (x.paidBefore || 0) : 0, firstInvoice: x.firstInvoice, customAmounts: parseCustom(x.customText), notes: x.notes };
      if (isNew) st.purchases.push({ id: U.uid('p_'), kind: 'compra', status: 'ativa', createdAt: Date.now(), ...obj });
      else Object.assign(st.purchases.find((y) => y.id === p.id), obj);
    }, isNew ? 'Compra registrada.' : 'Compra atualizada.'),
  });
  // recalcula a fatura sugerida ao trocar cartão ou data em compra nova
  if (isNew) {
    const f = $('#modals .modal-wrap:last-child form');
    const upd = () => { const c = S.cards.find((y) => y.id === f.querySelector('[name=cardId]').value); const dt = f.querySelector('[name=date]').value; const mode = f.querySelector('input[name=mode]:checked')?.value; if (c && dt && mode === 'total') f.querySelector('[name=firstInvoice]').value = E.invoiceMonthFor(c, dt); f.dispatchEvent(new Event('input')); };
    f.querySelector('[name=cardId]').addEventListener('change', upd);
    f.querySelector('[name=date]').addEventListener('change', upd);
  }
}
function parseCustom(t) {
  if (!t || !String(t).trim()) return null;
  const parts = String(t).split(';').map((s) => U.toCents(s.trim()));
  if (parts.some((x) => x === null || x <= 0)) return null;
  return parts;
}

/* ---------- Pix no crédito ---------- */
function pixView() {

  return `<header class="page-h"><div><p class="eyebrow">Módulo</p><h1>Calendário e projeções</h1></div><button class="btn primary hide-m" data-act="quickAdd">${icon('plus')}Lançar</button></header>
  ${tabs([['mes', 'Mês'], ['dia', 'Lista por dia'], ['projecao', 'Projeção de caixa']], t)}${body()}`;

function calFilter(items) {
  const nat = UI.filters.calNat || '';
  const kind = UI.filters.calKind || '';
  return items.filter((i) => {
    if (i.status === 'cancelado' || !i.cash.length) return false;
    if (nat && i.nature !== nat && !(i.type === 'transferencia')) return false;
    const net = i.cash.reduce((a, c) => a + c.delta, 0);
    if (kind === 'in' && !(net > 0)) return false;
    if (kind === 'out' && !(net < 0)) return false;
    if (kind === 'late' && i.status !== 'vencido') return false;
    if (kind === 'transf' && i.type !== 'transferencia') return false;
    return true;
  });
}
function calToolbar() {
  const nat = UI.filters.calNat || '', kind = UI.filters.calKind || '';
  return `<label class="sel"><span class="sr">Natureza</span><select data-chg="setFilter" data-key="calNat"><option value="">Pessoal e profissional</option><option value="pessoal" ${nat === 'pessoal' ? 'selected' : ''}>Só pessoal</option><option value="profissional" ${nat === 'profissional' ? 'selected' : ''}>Só profissional</option></select></label>
  <label class="sel"><span class="sr">Tipo</span><select data-chg="setFilter" data-key="calKind"><option value="">Tudo</option><option value="in" ${kind === 'in' ? 'selected' : ''}>Recebimentos</option><option value="out" ${kind === 'out' ? 'selected' : ''}>Vencimentos e parcelas</option><option value="transf" ${kind === 'transf' ? 'selected' : ''}>Transferências</option><option value="late" ${kind === 'late' ? 'selected' : ''}>Em atraso</option></select></label>`;
}

function calMonthView() {
  const T = E.today();
  const m = UI.calMonth || U.monthKey(T);
  const sel = UI.calDay || T;
  const d = data();
  const items = calFilter(d.items.filter((i) => U.monthKey(i.date) === m || (i.status === 'vencido' && m === U.monthKey(T))));
  const byDay = {};
  for (const i of items) { const day = i.status === 'vencido' && m === U.monthKey(T) ? i.date : i.date; (byDay[day] = byDay[day] || []).push(i); }
  const first = m + '-01';
  const startW = U.weekday(first);
  const dim = U.dim(+m.slice(0, 4), +m.slice(5, 7));
  let cells = '';
  for (let i = 0; i < startW; i++) cells += '<div class="cal-c empty" aria-hidden="true"></div>';
  for (let day = 1; day <= dim; day++) {
    const ds = `${m}-${U.pad(day)}`;
    const list = byDay[ds] || [];
    const inn = U.sum(list, (i) => Math.max(0, i.cash.reduce((a, c) => a + c.delta, 0)));
    const out = U.sum(list.filter((i) => i.type !== 'transferencia'), (i) => Math.max(0, -i.cash.reduce((a, c) => a + c.delta, 0)));
    const late = list.some((i) => i.status === 'vencido');
    cells += `<button class="cal-c ${ds === T ? 'today' : ''} ${ds === sel ? 'sel' : ''} ${late ? 'late' : ''}" data-act="calDay" data-d="${ds}" aria-label="${U.fmtDate(ds)}: ${list.length} registros"><span class="cal-n">${day}</span>${inn ? `<span class="cal-in">+${U.moneyShort(inn).replace('R$ ', '')}</span>` : ''}${out ? `<span class="cal-out">−${U.moneyShort(out).replace('R$ ', '')}</span>` : ''}${list.length ? `<span class="cal-dots">${list.slice(0, 4).map((i) => `<i class="d-${i.status}"></i>`).join('')}</span>` : ''}</button>`;
  }
  const dayItems = calFilter(d.items.filter((i) => i.date === sel));
  const overdue = U.monthKey(sel) === U.monthKey(T) ? calFilter(d.items.filter((i) => i.status === 'vencido')) : [];
  return `<div class="toolbar"><div class="month-nav"><button class="icon-btn" data-act="calNav" data-n="-1" aria-label="Mês anterior">${icon('left')}</button><strong>${U.fmtMonthFull(m)}</strong><button class="icon-btn" data-act="calNav" data-n="1" aria-label="Próximo mês">${icon('right')}</button><button class="btn ghost sm" data-act="calToday">Hoje</button></div>${calToolbar()}</div>
  <div class="card cal"><div class="cal-h">${U.WEEK.map((w) => `<span>${w}</span>`).join('')}</div><div class="cal-g">${cells}</div>
  <div class="legend"><span><i class="sw d-previsto"></i>Previsto</span><span><i class="sw d-pago"></i>Pago ou recebido</span><span><i class="sw d-vencido"></i>Em atraso</span></div></div>
  <section class="card"><h2>${U.fmtDate(sel)}</h2><div class="list">${dayItems.length ? dayItems.map((i) => itemRow(i, { showDate: false, nature: true })).join('') : emptyState('Nada neste dia.')}</div></section>
  ${overdue.length ? `<section class="card"><h2>${icon('alert')}Em atraso</h2><div class="list">${overdue.map((i) => itemRow(i, { nature: true })).join('')}</div></section>` : ''}`;
}
ACT.calDay = (d) => { UI.calDay = d.d; render(); };
ACT.calNav = (d) => { UI.calMonth = U.addMonthKey(UI.calMonth || U.monthKey(E.today()), +d.n); render(); };
ACT.calToday = () => { UI.calMonth = U.monthKey(E.today()); UI.calDay = E.today(); render(); };

function calListView() {
  const T = E.today();
  const days = +(UI.filters.listDays || 30);
  const to = U.addDays(T, days);
  const d = data();
  const items = calFilter(d.items.filter((i) => (i.date >= T && i.date <= to && i.status !== 'pago') || i.status === 'vencido' || (i.status === 'pago' && i.date >= U.addDays(T, -7) && i.date <= T)));
  const groups = U.groupBy(items, (i) => (i.status === 'vencido' ? '0000-atraso' : i.date));
  const keys = Object.keys(groups).sort();
  return `<div class="toolbar"><label class="sel"><span class="sr">Período</span><select data-chg="setFilter" data-key="listDays">${[7, 15, 30, 60, 90].map((x) => `<option value="${x}" ${days === x ? 'selected' : ''}>Próximos ${x} dias</option>`).join('')}</select></label>${calToolbar()}</div>
  <p class="muted small">Inclui o que está em atraso e o que foi confirmado nos últimos 7 dias.</p>
  ${keys.length ? keys.map((k) => { const list = groups[k]; const net = U.sum(list.filter((i) => i.type !== 'transferencia'), (i) => i.cash.reduce((a, c) => a + c.delta, 0)); return `<section class="day-g"><h3>${k === '0000-atraso' ? `${icon('alert')} Em atraso` : `${U.WEEK[U.weekday(k)]}, ${U.fmtDate(k)}${k === T ? ' · hoje' : ''}`}<span class="${net < 0 ? 'amt-out' : 'amt-in'}">${signed(net)}</span></h3><div class="card list">${list.map((i) => itemRow(i, { showDate: k === '0000-atraso', nature: true })).join('')}</div></section>`; }).join('') : emptyState('Nada previsto no período.')}`;
}

/* ---------- Projeção ---------- */
function projectionView() {
  const T = E.today();
  const pm = UI.projMonths;
  const to = pm === 'custom' ? (UI.projCustom || U.addMonths(T, 6)) : U.addMonths(T, +pm);
  const view = UI.projView;
  const opts = { to };
  if (view === 'pessoal' || view === 'profissional') opts.nature = view;
  if (view === 'conta' && UI.projAccount) opts.accountIds = [UI.projAccount];
  const p = E.projection(S, opts);
  // cenários separados
  const delay = +(UI.filters.scDelay || 0);
  const endClient = UI.filters.scEndClient || '';
  const endDate = UI.filters.scEndDate || U.addMonths(T, 1);
  let sc = null;
  if (delay || endClient) {
    const hyps = [];
    if (delay) for (const c of S.clients.filter((x) => !x.archived && x.status === 'ativo')) hyps.push({ type: 'atraso', clientId: c.id, days: delay });
    if (endClient) hyps.push({ type: 'fim_contrato', clientId: endClient, endDate });
    const clone = U.clone(S);
    for (const hh of hyps) SIM.apply(clone, hh);
    sc = E.projection(clone, opts);
  }
  const months = p.months;
  return `<div class="toolbar">
    <label class="sel"><span class="sr">Período</span><select data-chg="projMonths">${[3, 6, 12, 24].map((x) => `<option value="${x}" ${String(pm) === String(x) ? 'selected' : ''}>${x} meses</option>`).join('')}<option value="custom" ${pm === 'custom' ? 'selected' : ''}>Personalizado</option></select></label>
    ${pm === 'custom' ? `<label class="sel">até <input type="date" data-chg="projCustom" value="${h(to)}" min="${T}"></label>` : ''}
    <label class="sel"><span class="sr">Visão</span><select data-chg="projView"><option value="geral" ${view === 'geral' ? 'selected' : ''}>Todas as contas</option><option value="pessoal" ${view === 'pessoal' ? 'selected' : ''}>Pessoal</option><option value="profissional" ${view === 'profissional' ? 'selected' : ''}>Profissional</option><option value="conta" ${view === 'conta' ? 'selected' : ''}>Por conta</option></select></label>
    ${view === 'conta' ? `<label class="sel"><span class="sr">Conta</span><select data-chg="projAccount"><option value="">Escolha a conta</option>${S.accounts.filter((a) => !a.archived).map((a) => `<option value="${a.id}" ${UI.projAccount === a.id ? 'selected' : ''}>${h(a.name)}</option>`).join('')}</select></label>` : ''}
  </div>
  ${partialBanner(p.partial)}
  ${view === 'pessoal' || view === 'profissional' ? `<div class="banner soft">${icon('info')}<span>Visão por natureza: o saldo inicial vem das contas do tipo ${view === 'pessoal' ? 'pessoal' : 'PJ'}, ajustado pelas atribuições que você fez. Como o dinheiro circula entre as contas, é uma aproximação.</span></div>` : ''}
  <section class="kpis">
    ${kpi('Saldo inicial (hoje)', money(p.start))}
    ${kpi('Entradas previstas', `<span class="amt-in">${money(p.totalIn)}</span>`, p.overdueRecv.length ? `${money(U.sum(p.overdueRecv, (x) => x.amount))} em atraso fora da conta` : '')}
    ${kpi('Saídas previstas', `<span class="amt-out">${money(p.totalOut)}</span>`)}
    ${kpi('Saldo final', money(p.end), `em ${U.fmtDate(p.to)}`, p.end < 0 ? 'bad' : '')}
    ${kpi('Menor saldo', money(p.minBal), U.fmtDate(p.minDate), p.minBal < 0 ? 'bad' : '')}
    ${kpi('Primeiro dia de insuficiência', p.firstNeg ? U.fmtDate(p.firstNeg) : 'nenhum', p.firstNeg ? `${U.plural(p.negDays, 'dia', 'dias')} no negativo` : 'no período', p.firstNeg ? 'bad' : 'good')}
  </section>
  <section class="card"><h2>Saldo dia a dia</h2>${lineChart(p.days, { height: 200 })}${sc ? `<h3 class="sec">Cenário: ${[delay ? `recebimentos de clientes com ${delay} dias de atraso` : '', endClient ? `contrato de ${h((S.clients.find((c) => c.id === endClient) || {}).name)} terminando em ${U.fmtDate(endDate)}` : ''].filter(Boolean).join(' e ')}</h3>${lineChart(sc.days, { height: 160 })}<p class="small">Menor saldo no cenário: <strong>${money(sc.minBal)}</strong> em ${U.fmtDate(sc.minDate)} · primeira falta: ${sc.firstNeg ? `<span class="txt-bad">${U.fmtDate(sc.firstNeg)}</span>` : 'nenhuma'} · saldo final ${money(sc.end)} (${signed(sc.end - p.end)} em relação à projeção principal)</p>` : ''}</section>
  <section class="card"><h2>Cenários separados</h2><p class="muted small">Não alteram seus dados nem a projeção principal.</p>
    <div class="grid-f">
      <div class="field half"><label for="sc_d">Atraso nos recebimentos de clientes</label><select id="sc_d" data-chg="setFilter" data-key="scDelay">${[0, 5, 10, 15, 30, 45].map((x) => `<option value="${x}" ${delay === x ? 'selected' : ''}>${x ? x + ' dias' : 'Sem atraso'}</option>`).join('')}</select></div>
      <div class="field half"><label for="sc_c">Término de contrato</label><select id="sc_c" data-chg="setFilter" data-key="scEndClient"><option value="">Nenhum</option>${S.clients.filter((c) => !c.archived && c.status === 'ativo').map((c) => `<option value="${c.id}" ${endClient === c.id ? 'selected' : ''}>${h(c.name)}</option>`).join('')}</select></div>
      ${endClient ? `<div class="field half"><label for="sc_e">Último dia do contrato</label><input id="sc_e" type="date" data-chg="setFilter" data-key="scEndDate" value="${h(endDate)}"></div>` : ''}
    </div>
    <label class="check-inline"><input type="checkbox" data-chg="toggleOverdueRecv" ${S.settings.overdueReceivables === 'incluir' ? 'checked' : ''}> Contar recebimentos em atraso como se chegassem hoje (na projeção principal)</label></section>
  <section class="card"><h2>Mês a mês</h2><div class="months">${months.map((mm) => `<div class="mcard ${mm.min < 0 ? 'neg' : ''}"><strong>${U.fmtMonthFull(mm.month)}</strong><dl class="dl compact"><dt>Saldo no início</dt><dd>${money(mm.start)}</dd><dt>Entradas</dt><dd class="amt-in">${money(mm.in)}</dd>${Object.entries(mm.inBy).map(([k, v]) => `<dt class="sub">${CERT_LABEL[k] || k}</dt><dd class="sub">${money(v)}</dd>`).join('')}<dt>Saídas</dt><dd class="amt-out">${money(mm.out)}</dd>${Object.entries(mm.outBy).map(([k, v]) => `<dt class="sub">${{ despesas: 'Despesas', cartoes: 'Faturas de cartão', dividas: 'Dívidas', reservas: 'Aportes planejados', transferencias: 'Transferências' }[k] || k}</dt><dd class="sub">${money(v)}</dd>`).join('')}<dt>Saldo no fim</dt><dd><strong>${money(mm.end)}</strong></dd><dt>Menor saldo</dt><dd class="${mm.min < 0 ? 'txt-bad' : ''}">${money(mm.min)} (${U.fmtDay(mm.minDate)})</dd></dl></div>`).join('')}</div>
  <p class="muted small">Contratado: mensalidades de clientes e parcelas. Confirmado: valores conhecidos. Estimado: contas variáveis. Planejado: aportes em reservas. Hipóteses do simulador nunca entram aqui. Pagamentos já confirmados não são reaplicados.</p></section>`;
}
CHG.projMonths = (v) => { UI.projMonths = v === 'custom' ? 'custom' : +v; render(); };
CHG.projCustom = (v) => { if (U.validISO(v) && v > E.today()) { UI.projCustom = U.diffDays(E.today(), v) > 3660 ? U.addMonths(E.today(), 120) : v; render(); } };
CHG.projView = (v) => { UI.projView = v; render(); };
CHG.projAccount = (v) => { UI.projAccount = v; render(); };
CHG.toggleOverdueRecv = (v, el) => commit((st) => { st.settings.overdueReceivables = el.checked ? 'incluir' : 'excluir'; }, 'Preferência salva.', { noUndo: true });

/* Reservas de emergência, objetivos e simulador de acumulação. */

VIEWS.reservas = () => {
  const t = curTab('pessoal');
  const body = t === 'simulador' ? accumView() : reservesView(t === 'profissional' ? 'profissional' : 'pessoal');
  return `<header class="page-h"><div><p class="eyebrow">Módulo</p><h1>Reservas e investimentos</h1></div></header>
  ${tabs([['pessoal', 'Pessoal'], ['profissional', 'Profissional'], ['simulador', 'Simulador de acumulação']], t)}${body}`;

function reservesView(nature) {
  const d = data();
  const list = S.reserves.filter((r) => r.nature === nature && !r.archived);
  const arch = S.reserves.filter((r) => r.nature === nature && r.archived);
  const bal = E.balances(S, d);
  const reserved = U.sum(list, (r) => E.reserveBalance(S, r));
  const free = bal.byNature[nature];
  const com = nature === 'pessoal' ? E.commitment(S, d, [U.monthKey(E.today()), U.addMonthKey(U.monthKey(E.today()), 1), U.addMonthKey(U.monthKey(E.today()), 2)]) : null;
  const deficit = com && com.sobra < 0;
  const plans = U.sum(list, (r) => r.monthlyPlan || 0);
  return `<section class="kpis">
    ${kpi('Dinheiro livre', money(free), `nas contas, atribuído ao ${nature}`)}
    ${kpi('Reservado', money(reserved), 'separado em reservas e objetivos')}
    ${kpi('Total', money(free + reserved), 'livre + reservado')}
    ${kpi('Aportes mensais planejados', money(plans), S.settings.includePlannedContributions ? 'incluídos na projeção de caixa' : 'fora da projeção (ver Configurações)')}
  </section>
  ${deficit ? `<div class="banner warn">${icon('warn')}<div>Nos próximos 3 meses, as saídas pessoais cadastradas superam as entradas em ${money(-com.sobra)}. Antes de planejar aportes, o painel recomenda cobrir esse déficit. Aportes planejados que gerem falta de dinheiro aparecem nos alertas.</div></div>` : ''}
  <p class="muted small">Aporte em reserva não é despesa nem renda: o dinheiro sai da conta (livre) e passa a ficar reservado. Cada reserva tem saldo próprio, então o mesmo dinheiro nunca é contado em duas metas.</p>
  <div class="actions"><button class="btn primary" data-act="newReserve" data-nature="${nature}" data-kind="reserva">${icon('plus')}Reserva de emergência</button><button class="btn ghost" data-act="newReserve" data-nature="${nature}" data-kind="objetivo">${icon('plus')}Objetivo</button></div>
  <div class="cards-grid">${list.length ? list.map((r) => reserveCard(r, d)).join('') : emptyState(`Nenhuma reserva ${nature} criada ainda.`)}</div>
  ${arch.length ? `<h3 class="sec">Arquivadas</h3><div class="card list">${arch.map((r) => `<button class="row" data-act="editReserve" data-id="${r.id}"><div class="row-main"><span class="row-t">${h(r.name)}</span></div><strong class="row-amt">${money(E.reserveBalance(S, r))}</strong></button>`).join('')}</div>` : ''}`;
}
function reserveCard(r, d) {
  const info = E.reserveInfo(S, d, r);
  const moves = S.entries.filter((e) => e.type === 'reserva' && e.reserveId === r.id && e.status === 'pago').slice(-3).reverse();
  return `<div class="card ccard" id="rec-${r.id}"><div class="debt-h"><strong>${h(r.name)}</strong><span class="pill soft">${r.kind === 'reserva' ? 'reserva de emergência' : 'objetivo'}</span></div>
  <span class="big-num">${money(info.balance)}</span>
  ${info.target != null ? `${progressBar(info.progress, 'Progresso')}<small>${U.pct(info.progress)} de ${money(info.target)} · faltam ${money(info.missing)}</small>` : '<small class="muted">Sem valor-alvo definido.</small>'}
  <dl class="dl compact">
    ${r.kind === 'reserva' ? `<dt>Custo mensal da base</dt><dd>${info.base.value != null ? money(info.base.value) : '<span class="muted">não definido</span>'}</dd><dt>Meses de cobertura desejados</dt><dd>${info.months}</dd><dt>Meses cobertos hoje</dt><dd>${info.covered != null ? info.covered.toLocaleString('pt-BR', { maximumFractionDigits: 1 }) : 'sem base'}</dd>` : ''}
    ${r.deadline ? `<dt>Prazo</dt><dd>${U.fmtDate(r.deadline)}</dd>` : ''}
    ${info.requiredMonthly ? `<dt>Aporte necessário</dt><dd>${money(info.requiredMonthly)} por mês</dd>` : ''}
    <dt>Aporte planejado</dt><dd>${r.monthlyPlan ? `${money(r.monthlyPlan)} por mês, dia ${r.planDay || 5}, da conta ${h(accName(r.planAccountId))}` : 'nenhum'}</dd>
  </dl>
  ${r.kind === 'reserva' ? `<small class="muted">Base: ${h(info.base.explain)}.</small>` : ''}
  ${moves.length ? `<ul class="mini">${moves.map((e) => `<li><strong>${e.op === 'retirada' ? '−' : '+'}${money(e.amount)}</strong><small>${e.op} em ${U.fmtDate(e.paidDate)}</small></li>`).join('')}</ul>` : ''}
  <div class="actions wrap"><button class="btn primary sm" data-act="reserveMove" data-id="${r.id}" data-op="aporte">Aporte</button><button class="btn ghost sm" data-act="reserveMove" data-id="${r.id}" data-op="retirada">Retirada</button><button class="btn ghost sm" data-act="reserveMove" data-id="${r.id}" data-op="rendimento">Rendimento</button><button class="btn ghost sm" data-act="editReserve" data-id="${r.id}">${icon('edit')}Editar</button></div></div>`;
}

ACT.newReserve = (d) => { closeAllModals(); reserveForm(null, d.nature || 'pessoal', d.kind || 'reserva'); };
ACT.editReserve = (d) => reserveForm(S.reserves.find((r) => r.id === d.id));
function reserveForm(r, nature, kind) {
  const isNew = !r;
  nature = r ? r.nature : nature;
  kind = r ? r.kind : kind;
  const series = S.series.filter((s) => !s.archived && s.type === 'despesa' && s.nature === nature);
  const v = r ? { ...r, baseMode: r.base?.mode || 'itens', seriesIds: r.base?.seriesIds || [], manual: r.base?.manual ?? null, extra: r.base?.extra ?? null, avgMonths: r.base?.avgMonths || 3, categoryIds: r.base?.categoryIds || [] } : { nature, kind, name: kind === 'reserva' ? `Reserva de emergência ${nature}` : '', months: 6, baseMode: 'itens', seriesIds: series.filter((s) => (S.categories.find((c) => c.id === s.categoryId) || {}).essential).map((s) => s.id), initialBalance: 0, initialDate: E.today(), planDay: 5, planAccountId: nature === 'profissional' ? S.settings.defaultProAccountId : S.settings.defaultPesAccountId, avgMonths: 3 };
  const fields = [
    { k: 'name', label: 'Nome', type: 'text', req: true },
    ...(kind === 'reserva' ? [
      { k: 'months', label: 'Meses de cobertura', type: 'chips', options: [[3, '3 meses'], [6, '6 meses'], [9, '9 meses'], [12, '12 meses']], help: 'Outro valor: escolha o mais próximo e ajuste depois em "meses personalizados".' },
      { k: 'monthsCustom', label: 'Meses personalizados (opcional)', type: 'number', min: 1, max: 60, step: 1, half: true },
      { k: 'baseMode', label: 'Como calcular o custo mensal', type: 'chips', options: [['itens', 'Despesas cadastradas'], ['media', 'Média do histórico'], ['manual', 'Valor manual']] },
      { k: 'seriesIds', label: 'Despesas recorrentes que entram na base', type: 'multi', options: series.map((s) => [s.id, `${s.description} (${money(E.seriesMonthly(s))}/mês)`]), when: (x) => x.baseMode === 'itens' },
      { k: 'extra', label: 'Valor adicional por mês (opcional)', type: 'money', min: 0, when: (x) => x.baseMode === 'itens', help: 'Para gastos que ainda não estão cadastrados como recorrentes, como mercado.' },
      { k: 'avgMonths', label: 'Meses de histórico', type: 'number', min: 1, max: 12, step: 1, when: (x) => x.baseMode === 'media' },
      { k: 'categoryIds', label: 'Categorias (vazio = todas)', type: 'multi', options: catOptions(nature, 'despesa', false), when: (x) => x.baseMode === 'media' },
      { k: 'manual', label: 'Custo mensal', type: 'money', min: 0, when: (x) => x.baseMode === 'manual' },
    ] : [
      { k: 'target', label: 'Valor-alvo', type: 'money', min: 1, half: true, req: true },
      { k: 'deadline', label: 'Prazo', type: 'date', half: true },
    ]),
    { k: 'initialBalance', label: 'Saldo que já está guardado', type: 'money', min: 0, half: true, when: () => isNew || !S.entries.some((e) => e.reserveId === r.id), help: 'Dinheiro que já está separado fora das contas cadastradas.' },
    { k: 'initialDate', label: 'Data desse saldo', type: 'date', half: true, when: () => isNew || !S.entries.some((e) => e.reserveId === r.id) },
    { k: 'monthlyPlan', label: 'Aporte mensal planejado', type: 'money', min: 0, half: true },
    { k: 'planDay', label: 'Dia do aporte', type: 'number', min: 1, max: 31, step: 1, half: true, when: (x) => x.monthlyPlan > 0 },
    { k: 'planAccountId', label: 'Conta de onde sai o aporte', type: 'select', options: accOptions(), when: (x) => x.monthlyPlan > 0 },
    { k: 'notes', label: 'Observações (onde o dinheiro está guardado, por exemplo)', type: 'textarea' },
    { k: 'prev', type: 'info', info: (x) => {
      if (kind === 'reserva') {
        const months = x.monthsCustom || +x.months || 6;
        const fake = { ...x, kind, months, base: { mode: x.baseMode, seriesIds: x.seriesIds, manual: x.manual, extra: x.extra, avgMonths: x.avgMonths, categoryIds: x.categoryIds } };
        const info = E.reserveInfo(S, data(), { ...fake, id: r?.id || 'tmp' });
        return info.base.value != null ? `<div class="banner soft">${icon('target')}<div>Custo mensal: <strong>${money(info.base.value)}</strong> (${h(info.base.explain)}). Reserva necessária: <strong>${money(info.target)}</strong> para ${months} meses.${x.monthlyPlan ? ` Com ${money(x.monthlyPlan)} por mês, faltariam cerca de ${Math.ceil(Math.max(0, info.target - (info.balance || 0)) / x.monthlyPlan)} meses.` : ''}</div></div>` : `<p class="txt-warn small">${h(info.base.explain)}.</p>`;
      }
      if (x.target && x.deadline) { const m = Math.max(1, U.monthsDiff(U.monthKey(E.today()), U.monthKey(x.deadline))); return `<p class="small">Para chegar a ${money(x.target)} em ${U.plural(m, 'mês', 'meses')}: cerca de ${money(Math.ceil(Math.max(0, x.target - (r ? E.reserveBalance(S, r) : x.initialBalance || 0)) / m))} por mês.</p>`; }

  openForm({

/* ---------- Simulador de acumulação ---------- */
function accumView() {
  const f = UI.acc = UI.acc || { initial: 0, monthly: 50000, months: 24, rate: 10, ratePeriod: 'anual', timing: 'fim', adminYear: 0, taxPct: 0 };
  const r = E.accumulate(f);
  const W = 640, H = 180, pl = 56, pb = 24, pt = 10;
  const max = Math.max(1, ...r.rows.map((x) => x.bal));
  const x = (i) => pl + (i / Math.max(1, r.rows.length - 1)) * (W - pl - 10);
  const y = (v) => pt + (1 - v / max) * (H - pt - pb);
  const lineBal = r.rows.map((row, i) => `${x(i)},${y(row.bal)}`).join(' ');
  const lineCon = r.rows.map((row, i) => `${x(i)},${y(row.contributed)}`).join(' ');
  const step = Math.max(1, Math.round(r.rows.length / 6));
  const chart = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução simulada"><line x1="${pl}" x2="${W - 10}" y1="${y(max)}" y2="${y(max)}" class="grid"/><text x="${pl - 6}" y="${y(max) + 4}" text-anchor="end" class="axis">${U.moneyShort(max)}</text><line x1="${pl}" x2="${W - 10}" y1="${y(0)}" y2="${y(0)}" class="grid"/><text x="${pl - 6}" y="${y(0) + 4}" text-anchor="end" class="axis">R$ 0</text><polyline points="${lineCon}" class="line2"/><polyline points="${lineBal}" class="line"/>${r.rows.map((row, i) => i % step === 0 || i === r.rows.length - 1 ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" class="axis">${row.m}</text>` : '').join('')}</svg><div class="legend"><span><i class="sw sw-in"></i>Saldo estimado</span><span><i class="sw sw-con"></i>Total aportado</span></div>`;
  const inp = (k, label, type = 'money', extra = '') => `<div class="field half"><label for="ac_${k}">${label}</label>${type === 'money' ? `<div class="money-in"><span>R$</span><input id="ac_${k}" inputmode="decimal" data-chg="acc" data-f="${k}" value="${U.moneyInput(f[k])}"></div>` : `<input id="ac_${k}" type="number" step="any" data-chg="acc" data-f="${k}" value="${f[k]}" ${extra}>`}</div>`;
  return `<p class="muted">Simulação para entender o efeito de aportes e rendimento no tempo. Rendimento estimado não é garantido e não entra como receita confirmada. O painel não recomenda produtos.</p>
  <div class="two"><div class="card"><div class="grid-f">
    ${inp('initial', 'Saldo inicial')}${inp('monthly', 'Aporte mensal')}${inp('months', 'Prazo (meses)', 'number', 'min="1" max="600"')}
    ${inp('rate', 'Taxa de rendimento (%)', 'number', 'min="0"')}
    <div class="field half"><label for="ac_rp">Taxa informada ao</label><select id="ac_rp" data-chg="acc" data-f="ratePeriod"><option value="anual" ${f.ratePeriod === 'anual' ? 'selected' : ''}>Ano</option><option value="mensal" ${f.ratePeriod === 'mensal' ? 'selected' : ''}>Mês</option></select></div>
    <div class="field half"><label for="ac_t">Aporte no</label><select id="ac_t" data-chg="acc" data-f="timing"><option value="fim" ${f.timing === 'fim' ? 'selected' : ''}>Fim do mês</option><option value="inicio" ${f.timing === 'inicio' ? 'selected' : ''}>Início do mês</option></select></div>
    ${inp('adminYear', 'Taxa de administração (% ao ano, opcional)', 'number', 'min="0"')}${inp('taxPct', 'Imposto sobre o rendimento (%, opcional)', 'number', 'min="0" max="100"')}
  </div><p class="muted small">Taxa equivalente: ${U.pct(r.monthlyRate, 3)} ao mês${f.ratePeriod === 'anual' ? ` (de ${f.rate}% ao ano, por juros compostos)` : `, ou ${U.pct(Math.pow(1 + r.monthlyRate, 12) - 1, 2)} ao ano`}. Taxas e imposto só entram se você informar.</p></div>
  <div class="card"><section class="kpis k2">${kpi('Total aportado', money(r.contributed))}${kpi('Rendimento estimado', money(r.gain))}${f.taxPct ? kpi('Imposto informado', money(r.tax)) : ''}${kpi('Saldo final estimado', money(r.final), `em ${U.plural(f.months, 'mês', 'meses')}`)}</section>${chart}</div></div>
  <section class="card"><h2>Evolução mês a mês</h2><div class="table-wrap"><table class="tbl"><thead><tr><th>Mês</th><th>Aportado</th><th>Rendimento acumulado</th><th>Saldo</th></tr></thead><tbody>${r.rows.map((row) => `<tr><td>${row.m}</td><td>${money(row.contributed)}</td><td>${money(row.gain)}</td><td>${money(row.bal)}</td></tr>`).join('')}</tbody></table></div></section>`;
}

function analysisBlock(nature, d) {

    <h3 class="sec">Compromissos dos próximos 30 dias</h3><div class="list">${commits.length ? commits.map((i) => itemRow(i)).join('') : '<p class="muted small">Nenhum.</p>'}</div>

function habitObservations(nature, d) {
  const T = E.today();
  const out = [];
  const startM = U.monthKey(E.orgStart(S));
  const lastFull = U.addMonthKey(U.monthKey(T), -1);
  const fullMonths = lastFull >= startM ? U.monthsDiff(startM, lastFull) + (E.orgStart(S).slice(8) === '01' ? 1 : 0) : 0;
  if (fullMonths < 2) {
    out.push(`Ainda é cedo para conclusões sobre hábitos: ${fullMonths ? `há ${U.plural(fullMonths, 'mês completo', 'meses completos')}` : 'não há nenhum mês completo'} de registros desde ${U.fmtDate(E.orgStart(S))}. As comparações começam a partir de 2 meses completos.`);
  } else {
    const prevN = Math.min(3, fullMonths - 1);
    const prevMonths = U.monthRange(U.addMonthKey(lastFull, -prevN), U.addMonthKey(lastFull, -1));
    const last = E.results(S, d, nature, [lastFull]);
    const prev = prevMonths.map((m) => E.results(S, d, nature, [m]));
    let any = false;
    for (const c of Object.values(last.byCategory)) {
      const avg = U.sum(prev, (p) => p.byCategory[c.id]?.total || 0) / prevN;
      if (c.total > avg * 1.2 && c.total - avg > 5000) {
        const prevLast = prev[prev.length - 1].byCategory[c.id]?.total || 0;
        const prevBefore = prev.length > 1 ? (prev[prev.length - 2].byCategory[c.id]?.total || 0) : null;
        const trend = prevBefore != null && prevLast > prevBefore && c.total > prevLast;
        out.push(`${h(c.name)}: ${money(c.total)} em ${U.fmtMonth(lastFull)}, contra média de ${money(Math.round(avg))} em ${prevMonths.map(U.fmtMonth).join(', ')}. ${trend ? 'Aumentou em meses seguidos, o que indica tendência.' : 'Pode ser uma mudança pontual; vale observar o próximo mês.'}`);
        any = true;
      }
    }
    if (!any) out.push(`Nenhuma categoria subiu mais de 20% em ${U.fmtMonth(lastFull)} em relação à média dos meses anteriores.`);
  }
  const since = U.addDays(T, -60);
  const latePaid = S.entries.filter((e) => e.nature === nature && e.type === 'despesa' && e.status === 'pago' && e.paidDate && e.dueDate && e.paidDate > e.dueDate && e.paidDate >= since);
  if (latePaid.length) out.push(`${U.plural(latePaid.length, 'conta paga', 'contas pagas')} depois do vencimento nos últimos 60 dias (${latePaid.slice(0, 3).map((e) => h(e.description)).join(', ')}${latePaid.length > 3 ? '...' : ''}).`);
  const pix = S.purchases.filter((p) => p.kind === 'pix_credito' && p.nature === nature && p.status !== 'cancelada' && p.date >= since);
  if (pix.length) out.push(`${U.plural(pix.length, 'operação', 'operações')} de Pix no crédito nos últimos 60 dias, com custo de ${money(U.sum(pix, (p) => (p.total || 0) - (p.net || 0)))}.`);
  if (nature === 'pessoal') {
    const avoid = new Set([...(S.settings.avoidCardIds || []), ...S.cards.filter((c) => c.avoid).map((c) => c.id)]);
    const np = S.purchases.filter((p) => avoid.has(p.cardId) && p.status !== 'cancelada' && p.mode !== 'restante' && p.date >= (S.settings.cardGoalStart || E.orgStart(S)));
    if (avoid.size) out.push(np.length ? `${U.plural(np.length, 'compra nova', 'compras novas')} em cartões marcados para deixar de usar, somando ${money(U.sum(np, (p) => p.total || 0))}.` : 'Nenhuma compra nova nos cartões marcados para deixar de usar.');
  }
  return out;
}
function indicators(d) {
  const T = E.today();
  const p = E.projection(S, { to: U.addMonths(T, 6), data: d });
  const com = E.commitment(S, d, [U.monthKey(T)]);
  const res = S.reserves.filter((r) => !r.archived && r.kind === 'reserva').map((r) => E.reserveInfo(S, d, r));
  const debts = S.debts.filter((x) => x.status === 'ativa').map((x) => E.debtInfo(S, d, x));
  const rows = [
    ['Dias até a primeira falta de dinheiro', p.firstNeg ? U.plural(U.diffDays(T, p.firstNeg), 'dia') : 'nenhuma em 6 meses', 'Projeção de todas as contas com o que está cadastrado.' + (p.partial.length ? ' Projeção parcial.' : '')],
    ['Entradas pessoais comprometidas no mês', com.renda > 0 ? U.pct(com.pct.total) : 'sem entradas cadastradas', `Saídas pessoais do mês (${money(com.total)}) divididas pelas entradas pessoais (${money(com.renda)}).`],

  ];
  return `<div class="list">${rows.map(([l, v, c]) => `<div class="row static"><div class="row-main"><span class="row-t">${l}</span><span class="row-s">${c}</span></div><strong class="row-amt">${v}</strong></div>`).join('')}</div>`;

/* ---------- Plano de ação ---------- */
function currentTasks() {
  const T = E.today();
  const fromAlerts = safeAlerts().filter((a) => a.task).map((a) => ({ key: a.key, title: a.task, reason: a.reason, prio: a.prio, nature: a.nature, link: a.link, auto: true, due: a.kind === 'falta' ? a.key.split(':')[2] : null }));
  const seen = new Set();
  const list = [];
  for (const t of fromAlerts) { const tk = U.norm(t.title); if (seen.has(tk)) continue; seen.add(tk); list.push(t); }
  for (const m of S.manualTasks) list.push({ key: m.id, title: m.title, reason: m.notes || '', prio: m.prio || 2, nature: m.nature || 'geral', manual: true, due: m.due });
  return list.map((t) => {
    const st = S.tasks[t.key] || {};
    let status = st.status || 'pendente';
    if (status === 'adiado' && st.until && st.until <= T) status = 'pendente';
    return { ...t, status, until: st.until, doneAt: st.doneAt, priority: st.priority };
  });
}

  const done = tasks.filter((t) => t.status === 'feito');

async function saveFile(filename, text) {
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (dl) {
    try { await dl.save({ filename, data: text }); toast('Arquivo entregue para salvar.'); return; }
    catch (e) { if (e && e.code === 'declined') { toast('Download cancelado.'); return; } if (e && e.code === 'rate_limited') { toast('Aguarde um instante e tente de novo.', 'erro'); return; } }
  }
  const el = openModal(`<p>Não consegui oferecer o download nesta visualização. Copie o conteúdo abaixo e salve num arquivo chamado <strong>${h(filename)}</strong>.</p><textarea class="dump" readonly rows="10">${h(text)}</textarea><div class="actions"><button class="btn primary" data-act="copyDump">Copiar</button></div>`, { title: 'Salvar arquivo', wide: true });
  el.querySelector('textarea').addEventListener('focus', (e) => e.target.select());
}
ACT.copyDump = (d, btn) => { const ta = btn.closest('.modal').querySelector('textarea'); navigator.clipboard.writeText(ta.value).then(() => toast('Copiado.'), () => { ta.focus(); ta.select(); toast('Selecionei o texto: use copiar do seu aparelho.'); }); };
ACT.exportJSON = () => {
  const payload = { app: 'painel-financeiro-mel', version: M.SCHEMA, exportedAt: new Date().toISOString(), data: S };
  saveFile(`backup-financeiro-${E.today()}.json`, JSON.stringify(payload, null, 1));
};
CHG.importJSON = (v, el) => {
  const file = el.files && el.files[0];
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    let obj;
    try { obj = JSON.parse(rd.result); } catch (e) { toast('O arquivo não é um JSON válido.', 'erro'); return; }
    const errs = M.validateBackup(obj);
    if (errs.length) { toast(errs[0], 'erro'); return; }
    const st = M.migrate(obj.app ? obj.data : obj);
    confirmBox({
      title: 'Restaurar este backup?',
      body: `<p>Arquivo ${obj.exportedAt ? `exportado em ${U.fmtDate(obj.exportedAt.slice(0, 10))}` : 'sem data de exportação'}. Contém:</p><ul><li>${U.plural(st.accounts.length, 'conta')}</li><li>${U.plural(st.entries.length, 'lançamento')}</li><li>${U.plural(st.clients.length, 'cliente')}</li><li>${U.plural(st.cards.length, 'cartão', 'cartões')} e ${U.plural(st.purchases.length, 'compra')}</li><li>${U.plural(st.debts.length, 'dívida')}</li><li>${U.plural(st.reserves.length, 'reserva ou objetivo', 'reservas e objetivos')}</li></ul><p><strong>Os dados atuais serão substituídos.</strong> Uma cópia deles fica guardada neste navegador.</p>`,
      confirmLabel: 'Restaurar', danger: true,
      onConfirm: () => {
        try { const cur = STORE.readLocal() || {}; localStorage.setItem('painel-fin-mel-v1', JSON.stringify({ ...cur, preImport: S })); } catch (e) {}
        const rev = (S.meta.rev || 0) + 1;
        S = st; S.meta.rev = rev; UI.undo = null;
        if (UI.demo) { UI.demo = false; UI.realState = null; }
        STORE.save(S, true);
        try { const cur = STORE.readLocal() || {}; cur.preImport = cur.preImport || null; } catch (e) {}
        render(); toast('Backup restaurado.');
      },
    });
  };
  rd.readAsText(file);
  el.value = '';
};
ACT.restorePreImport = () => {
  const local = STORE.readLocal();

  confirmBox({ title: 'Voltar ao estado anterior?', body: '<p>Os dados atuais serão substituídos pelo que havia antes da última restauração de backup.</p>', confirmLabel: 'Voltar', onConfirm: () => { const rev = S.meta.rev + 1; S = M.migrate(local.preImport); S.meta.rev = rev; STORE.save(S, true); render(); toast('Estado anterior recuperado.'); } });

  let prev = [];
  if (c.accountId) prev = A.csvPreview(S, c.rows, { map: c.map, hasHeader: c.hasHeader, signMode: c.signMode, accountId: c.accountId, nature: c.nature, defaultCat: { despesa: c.catDesp || null, receita: c.catRec || null } });
  if (c.overrides) for (const p of prev) if (p.i in c.overrides) p.include = c.overrides[p.i] && !p.errs.length;
  c.preview = prev;
  const ok = prev.filter((p) => p.include).length;
  return `<section class="card"><h2>Arquivo: ${h(c.name)}</h2><p class="muted small">${U.plural(c.rows.length, 'linha')} encontradas, separador "${c.delim === '\t' ? 'tab' : c.delim}".</p>
    <label class="check-inline"><input type="checkbox" data-chg="csvOpt" data-k="hasHeader" ${c.hasHeader ? 'checked' : ''}> A primeira linha é o cabeçalho</label>
    <div class="grid-f">${sel('date', 'Coluna da data')}${sel('desc', 'Coluna da descrição')}${sel('amount', 'Coluna do valor')}
      <div class="field half"><label for="csv_sm">Entrada ou saída</label><select id="csv_sm" data-chg="csvOpt" data-k="signMode"><option value="sinal" ${c.signMode === 'sinal' ? 'selected' : ''}>Pelo sinal do valor (negativo = saída)</option><option value="coluna" ${c.signMode === 'coluna' ? 'selected' : ''}>Por uma coluna de tipo</option><option value="despesa" ${c.signMode === 'despesa' ? 'selected' : ''}>Tudo é saída</option><option value="receita" ${c.signMode === 'receita' ? 'selected' : ''}>Tudo é entrada</option></select></div>
      ${c.signMode === 'coluna' ? sel('type', 'Coluna do tipo (D/C, débito/crédito)') : ''}${sel('category', 'Coluna de categoria (opcional)', true)}
      <div class="field half"><label for="csv_acc">Conta</label><select id="csv_acc" data-chg="csvOpt" data-k="accountId"><option value="">Escolha a conta do extrato</option>${accOptions(null, false).map(([v, l]) => `<option value="${v}" ${c.accountId === v ? 'selected' : ''}>${h(l)}</option>`).join('')}</select></div>
      <div class="field half"><label for="csv_nat">Natureza</label><select id="csv_nat" data-chg="csvOpt" data-k="nature"><option value="pessoal" ${c.nature === 'pessoal' ? 'selected' : ''}>Pessoal</option><option value="profissional" ${c.nature === 'profissional' ? 'selected' : ''}>Profissional</option></select></div>
      <div class="field half"><label for="csv_cd">Categoria padrão das saídas</label><select id="csv_cd" data-chg="csvOpt" data-k="catDesp">${catOptions(c.nature, 'despesa').map(([v, l]) => `<option value="${v}" ${c.catDesp === v ? 'selected' : ''}>${h(l)}</option>`).join('')}</select></div>
      <div class="field half"><label for="csv_cr">Categoria padrão das entradas</label><select id="csv_cr" data-chg="csvOpt" data-k="catRec">${catOptions(c.nature, 'receita').map(([v, l]) => `<option value="${v}" ${c.catRec === v ? 'selected' : ''}>${h(l)}</option>`).join('')}</select></div>
    </div></section>
  ${c.accountId ? `<section class="card"><h2>Prévia</h2><p class="small">${ok} para importar · ${prev.filter((p) => p.dup).length} possíveis duplicidades · ${prev.filter((p) => p.errs.length).length} com erro. Desmarque o que não quiser. Transferências entre suas próprias contas devem ser lançadas como transferência, não importadas como receita ou despesa.</p>
    <div class="list">${prev.slice(0, 300).map((p) => `<label class="row static ${p.errs.length ? 'err-row' : ''}"><input type="checkbox" data-chg="csvRow" data-i="${p.i}" ${p.include ? 'checked' : ''} ${p.errs.length ? 'disabled' : ''}><div class="row-main"><span class="row-t">${h(p.desc)}</span><span class="row-s">${p.date ? U.fmtDate(p.date) : 'sem data'} · ${p.type === 'receita' ? 'entrada' : 'saída'}${p.errs.length ? ` · <span class="txt-bad">${p.errs.join(', ')}</span>` : ''}${p.dup ? ` · <span class="txt-warn">${p.dup}</span>` : ''}</span></div><strong class="row-amt ${p.type === 'receita' ? 'amt-in' : 'amt-out'}">${p.amount != null ? money(p.amount) : ''}</strong></label>`).join('')}</div>${prev.length > 300 ? '<p class="muted small">Mostrando as primeiras 300 linhas; todas serão consideradas.</p>' : ''}
    <div class="actions"><button class="btn ghost" data-act="csvCancel">Cancelar</button><button class="btn primary" data-act="csvCommit" ${ok ? '' : 'disabled'}>Importar ${U.plural(ok, 'lançamento')}</button></div></section>` : '<p class="muted">Escolha a conta do extrato para ver a prévia.</p>'}`;
}
CHG.csvFile = (v, el) => {
  const f = el.files && el.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    const { rows, delim } = A.parseCSV(String(rd.result));
    if (!rows.length) { toast('Não encontrei linhas no arquivo.', 'erro'); return; }
    const head = rows[0].map((x) => U.norm(x));
    const find = (re, def) => { const i = head.findIndex((x) => re.test(x)); return i >= 0 ? i : def; };
    UI.csv = { name: f.name, rows, delim, hasHeader: true, map: { date: find(/data|date/, 0), desc: find(/desc|hist|memo|lanc/, 1), amount: find(/valor|amount|quantia/, 2), type: find(/tipo|d\/c|natureza/, 3), category: find(/categ/, '') }, signMode: 'sinal', accountId: '', nature: 'pessoal', catDesp: '', catRec: '', overrides: {} };
    render();
  };
  rd.readAsText(f);
  el.value = '';
};
CHG.csvMap = (v, el) => { UI.csv.map[el.dataset.k] = v === '' ? null : +v; UI.csv.overrides = {}; render(); };
CHG.csvOpt = (v, el) => { UI.csv[el.dataset.k] = el.type === 'checkbox' ? el.checked : v; UI.csv.overrides = {}; render(); };
CHG.csvRow = (v, el) => { UI.csv.overrides[+el.dataset.i] = el.checked; };
ACT.csvCancel = () => { UI.csv = null; render(); };
ACT.csvCommit = () => {
  const prev = UI.csv.preview.map((p) => ({ ...p, include: (UI.csv.overrides[p.i] ?? p.include) && !p.errs.length }));
  const n = prev.filter((p) => p.include).length;
  confirmBox({ title: 'Importar lançamentos?', body: `<p>${U.plural(n, 'lançamento será criado', 'lançamentos serão criados')} na conta ${h(accName(UI.csv.accountId))}, como já pagos ou recebidos.</p>`, confirmLabel: 'Importar', onConfirm: () => { commit((st) => A.csvCommit(st, prev), `${U.plural(n, 'lançamento importado', 'lançamentos importados')}.`); UI.csv = null; render(); } });
};

/* Inicialização. */
function buildShell() {
  const nav = NAV.map(([r, l, ic]) => `<button class="nav-item" data-act="go" data-route="${r}">${icon(ic)}<span>${l}</span>${r === 'diagnostico' ? '<b class="alert-count" hidden></b>' : ''}</button>`).join('');
  document.getElementById('app').innerHTML = `
  <header class="top"><div class="brand"><span class="logo" aria-hidden="true">M</span><span class="brand-t">Finanças da Mel</span></div><div id="save-status" class="save" role="status" aria-live="polite"></div></header>
  <div id="demo-banner" class="demo-banner" hidden>${icon('flask')}<span>Modo demonstração: dados fictícios, nada é salvo.</span><button class="link" data-act="demoOff">Sair</button></div>
  <div class="layout"><nav class="side" aria-label="Módulos">${nav}</nav><main id="main" tabindex="-1"><div class="loading">Carregando seus dados…</div></main></div>
  <nav class="bottom" aria-label="Atalhos"><button class="nav-item" data-act="go" data-route="inicio">${icon('home')}<span>Início</span></button><button class="nav-item" data-act="go" data-route="calendario">${icon('calendar')}<span>Calendário</span></button><button class="fab" data-act="quickAdd" aria-label="Lançar">${icon('plus')}</button><button class="nav-item" data-act="go" data-route="diagnostico">${icon('pulse')}<span>Alertas</span><b class="alert-count" hidden></b></button><button class="nav-item" data-act="drawer">${icon('menu')}<span>Menu</span></button></nav>
  <div id="drawer" class="drawer" hidden><div class="drawer-in"><div class="modal-head"><h2>Módulos</h2><button class="icon-btn" data-act="closeDrawer" aria-label="Fechar">${icon('x')}</button></div>${nav}</div></div>
  <div id="modals"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>`;
  $('#drawer').addEventListener('mousedown', (e) => { if (e.target.id === 'drawer') closeDrawer(); });
}

async function boot() {
  buildShell();
  STORE.subscribe(() => renderStatus());
  try { const r = JSON.parse(localStorage.getItem('painel-fin-mel-route') || 'null'); if (r && VIEWS[r.route]) { UI.route = r.route; UI.tab = r.tab || {}; } } catch (e) {}
  const res = await STORE.init(async (meta) => {
    if (UI.demo) return;
    if (STORE.getStatus().state === 'salvando') return;
    try {
      const st = await STORE.reloadRemote();
      if (st && (st.meta?.rev || 0) > (S.meta.rev || 0)) { S = M.migrate(st); closeAllModals(); render(); toast('Dados atualizados com alterações feitas em outro aparelho.'); }
    } catch (e) { /* mantém o estado atual */ }
  });
  S = M.migrate(res.state || M.defaultState());
  if (res.needPush) STORE.save(S, true);
  UI.ready = true;
  render();
  if (res.notice) toast(res.notice, res.source === 'local' && STORE.getMode() !== 'nuvem' ? 'erro' : 'ok');
  let lastDay = E.today();
  setInterval(() => { const t = U.today(); if (t !== lastDay) { lastDay = t; render(); } }, 60000);
}
boot();
